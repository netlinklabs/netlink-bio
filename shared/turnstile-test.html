<!DOCTYPE html>
<html lang="en">
<head>
<!-- PAGE-TYPE: app -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Turnstile test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f8fafc; color: #0f172a; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; margin: 0 0 12px; color: #475569; }
  button { font-size: 15px; padding: 12px 14px; margin: 0 8px 8px 0; border: 0; border-radius: 10px; background: #0d9488; color: #fff; }
  button.alt { background: #334155; }
  #widget { min-height: 70px; margin: 8px 0 12px; }
  pre { font-size: 12px; line-height: 1.5; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>Turnstile test (temporary)</h1>
<p>Reload this page before each test. Tap one test, wait up to 30 seconds, then send a screenshot.</p>
<button id="btnVisible" type="button">Test 1: visible widget</button>
<button id="btnHelper" type="button" class="alt">Test 2: real login helper</button>
<div id="widget"></div>
<pre id="log"></pre>

<script>
  // Public Turnstile site key (safe to expose).
  const SITE_KEY = '0x4AAAAAAGAyQXsZM4W1z7mF';
  const out = document.getElementById('log');

  function log(msg) {
    out.textContent += new Date().toISOString().slice(11, 23) + '  ' + msg + '\n';
  }

  ['warn', 'error'].forEach((k) => {
    const orig = console[k];
    console[k] = function () {
      log('console.' + k + ': ' + Array.prototype.map.call(arguments, String).join(' '));
      orig.apply(console, arguments);
    };
  });
  window.addEventListener('error', (e) => log('window error: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => log('promise rejection: ' + ((e.reason && e.reason.message) || e.reason)));

  log('page loaded on host: ' + location.hostname);

  // Test 1: raw Turnstile, visible widget, documented onload callback.
  function test1() {
    log('--- test 1: visible widget');
    window.nlRawOnload = () => {
      log('api.js onload callback fired');
      let answered = false;
      const id = window.turnstile.render(document.getElementById('widget'), {
        sitekey: SITE_KEY,
        callback: (t) => { answered = true; log('TOKEN OK, length ' + t.length); },
        'error-callback': (c) => { answered = true; log('ERROR code: ' + c); },
        'before-interactive-callback': () => log('interaction needed, widget should be visible'),
      });
      log('rendered, widget id ' + id);
      setTimeout(() => { if (!answered) log('NO RESPONSE after 30 seconds'); }, 30000);
    };
    const s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=nlRawOnload';
    s.async = true;
    s.onerror = () => log('api.js FAILED to load (blocked or offline)');
    document.head.appendChild(s);
    log('loading api.js ...');
  }

  // Test 2: the real helper from /shared/turnstile.js, two calls in a row.
  function test2() {
    log('--- test 2: real login helper');
    window.NL_TURNSTILE_SITE_KEY = SITE_KEY;
    window.nlTurnstileDebug = (m) => log('  [helper] ' + m);
    const s = document.createElement('script');
    s.src = '/shared/turnstile.js?v=3';
    s.onload = async () => {
      log('helper loaded, enabled: ' + window.nlCaptcha.enabled);
      for (let i = 1; i <= 2; i++) {
        const t0 = performance.now();
        try {
          const o = await window.nlCaptcha.opts();
          const ms = Math.round(performance.now() - t0);
          log('call ' + i + ': ' + (o.captchaToken ? 'TOKEN OK, length ' + o.captchaToken.length : 'no token') + ' in ' + ms + ' ms');
        } catch (e) {
          log('call ' + i + ' FAILED: ' + e.message);
        }
      }
      log('done');
    };
    s.onerror = () => log('could not load /shared/turnstile.js');
    document.head.appendChild(s);
  }

  document.getElementById('btnVisible').addEventListener('click', test1);
  document.getElementById('btnHelper').addEventListener('click', test2);
</script>
</body>
</html>
