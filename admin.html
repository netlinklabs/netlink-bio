            const tiers = ['basic', 'silver', 'gold', 'platinum'].filter((t) => t !== 'platinum' || u.tiers.platinum);
            const meter = (name, used, limit) => { const pc = limit ? (used / limit) * 100 : 0; return `<div style="font-size:9pt"><b>${esc(name)}</b>: ${fmtBytes(used)} of ${fmtBytes(limit)} (${pc < 0.1 && used ? '<0.1' : pc.toFixed(1)}%)</div><div class="rp-meter"><div style="width:${Math.min(100, Math.max(used ? 1 : 0, pc)).toFixed(1)}%"></div></div>`; };
            const volRow = (name, usd, n) => `<tr><td>${esc(name)}</td><td class="n">${fmtUsd(usd)}</td><td class="n">${idr ? 'Rp ' + Math.round(usd * idr).toLocaleString('id-ID') : '-'}</td><td class="n">${esc(n)}</td></tr>`;
            const S1 = '#2a78d6', S2 = '#1baf7a', S3 = '#7c5cdb';
            const volSeries = p.tx_volume_series ? volumeSeries(p.tx_volume_series, d.buckets, polUsd) : null;
            const per = d.unit === 'month' ? 'month' : 'day';
            const fee = feeSummary(p.fee_income, d.buckets, polUsd);
            const period_ = `${fmtDay(d.period_start)} to ${fmtDay(d.period_end)}`;
            const partial = kind === 'month' ? period === new Date().toISOString().slice(0, 7) : Number(period) === now.getFullYear();

            return `<div class="rp">
                ${reportCover(kind, label, period_, partial, stamp, who)}
                <div class="rp-run">Netlink ${kind === 'month' ? 'Monthly' : 'Yearly'} Report · ${esc(label)}</div>

                <div class="rp-sec"><h2>Finance and income</h2><div class="rp-kpis">
                    ${kpi(fmtUsd(order), 'Order revenue (paid USDC, tests excluded)', rp(order))}${kpi(fee ? fmtUsd(fee.usd) : '-', 'Swap commission', fee ? rp(fee.usd) : '')}${kpi(fee ? fmtUsd(order + fee.usd) : '-', 'Total income', fee ? rp(order + fee.usd) : '')}${kpi(fee ? fmtN(fee.swaps) : '-', 'Swaps with commission')}</div>
                    <div class="rp-kpis">${kpi(fmtN(f.orders_in_range), 'Orders in period')}${kpi(fmtN(f.paid_in_range), 'Paid orders')}${kpi(fmtN(f.audit_in_range), 'Audit log entries')}</div>
                    <div class="rp-note">Order revenue is USDC paid for orders. Swap commission is the fee received on the Netlink fee wallet on Polygon (${esc(FEE_WALLET_SHORT)}), read from the blockchain; only transfers that belong to a swap made in Netlink Pay are counted${p.fee_unmatched ? ` (${fmtN(p.fee_unmatched)} other incoming transfers in this period are left out)` : ''}. USDC counts 1:1, POL uses the price at generation time${polUsd ? '' : ' (unavailable, POL is left out)'}. Amounts are what was received, before any costs.${idr ? ` Rupiah at 1 USD = Rp ${Math.round(idr).toLocaleString('id-ID')}.` : ''}${fee ? ` Commission received: ${fee.pol.toFixed(2)} POL and ${fmtUsd(fee.usdc)} in USDC.` : ''}${fee ? '' : ' Swap commission has not been synced from the blockchain yet, it is read once a day.'}</div>
                    ${printBars('Order revenue per ' + per + ' (USD)', d.buckets, d.unit, [{ name: 'Order revenue', values: f.series_revenue, color: S1 }], fmtUsd)}
                    ${fee ? printBars('Swap commission per ' + per + ' (USD)', d.buckets, d.unit, [{ name: 'Swap commission', values: fee.series, color: S2 }], fmtUsd) : ''}
                    ${fee ? printBars('Total income per ' + per + ' (USD)', d.buckets, d.unit, [{ name: 'Total income', values: fee.series.map((x, i) => x + (Number(f.series_revenue[i]) || 0)), color: S3 }], fmtUsd) : ''}</div>

                <div class="rp-sec"><h2>Users</h2><div class="rp-kpis">
                    ${kpi(fmtN(u.total), 'Users in total')}${kpi(fmtN(u.new_in_range), 'New users in period')}${kpi(fmtN(u.kyc) + ' / ' + fmtN(u.non_kyc), 'KYC verified / not verified')}${kpi(fmtN(u.kyc_in_range), 'KYC verified in period')}</div>
                    <table><thead><tr><th>Plan</th><th class="n">Users</th><th style="width:8%"></th><th>Top 10 countries</th><th class="n">Users</th></tr></thead><tbody>
                    ${Array.from({ length: Math.max(tiers.length, (u.countries || []).length, 1) }, (_, i) => {
                        const t = tiers[i]; const c = (u.countries || [])[i];
                        return `<tr><td>${t ? esc(TIER_LABEL[t]) : ''}</td><td class="n">${t ? fmtN(u.tiers[t] || 0) : ''}</td><td></td><td>${c ? esc(`${i + 1}. ${countryName(c.code)} (${c.code})`) : ''}</td><td class="n">${c ? fmtN(c.count) : ''}</td></tr>`;
                    }).join('')}</tbody></table>
                    ${u.country_unknown ? `<div class="rp-note">${fmtN(u.country_unknown)} users have not set a country. Plan, KYC and country figures are as of ${esc(stamp)}.</div>` : `<div class="rp-note">Plan, KYC and country figures are as of ${esc(stamp)}.</div>`}
                    ${u.series_total ? printBars('Total users at the end of each ' + per, d.buckets, d.unit, [{ name: 'Total users', values: u.series_total, color: S1 }]) : ''}
                    ${printBars('New users and KYC verified', d.buckets, d.unit, [{ name: 'New users', values: u.series_new, color: S1 }, { name: 'KYC verified', values: u.series_kyc, color: S2 }])}</div>

                <div class="rp-sec"><h2>Netlink Pay</h2><div class="rp-kpis">
                    ${kpi(fmtN(p.wallets), 'Wallets connected')}${kpi(fmtN(p.tx_in_range), 'Transactions in period')}${kpi(fmtN(p.tx_total), 'Transactions in total')}${kpi(fmtUsd(overall), 'Total volume')}</div>
                    <table><thead><tr><th>Volume</th><th class="n">USD</th><th class="n">IDR</th><th class="n">Transactions</th></tr></thead><tbody>
                    ${volRow('Total, all', overall, fmtN(v.send.n + v.receive.n + v.swap.n))}${volRow('Send', v.send.usd, fmtN(v.send.n))}${volRow('Receive', v.receive.usd, fmtN(v.receive.n))}${volRow('Swap', v.swap.usd, fmtN(v.swap.n))}${volRow('Order', order, fmtN(f.paid_in_range) + ' orders')}</tbody></table>
                    <div class="rp-note">${netTotal ? 'NET moved: ' + fmtN(netTotal) + ' NET, not valued in USD (no market price). ' : ''}${v.polMissing ? 'POL price was unavailable, POL amounts are left out. ' : ''}USDC counts 1:1, POL uses the price at generation time, a swap uses its USDC side. IDR rate: ${idr ? '1 USD = Rp ' + Math.round(idr).toLocaleString('id-ID') : 'unavailable'}. Total is Send + Receive + Swap; a transfer between two Netlink users appears in both Send and Receive, and Order paid from Netlink Pay is also inside Send.</div>
                    ${printBars('Transactions per ' + per, d.buckets, d.unit, [{ name: 'Transactions', values: p.series_tx, color: S1 }])}
                    ${volSeries ? printBars('Transaction volume per ' + per + ' (USD)', d.buckets, d.unit, [{ name: 'Volume', values: volSeries, color: S2 }], fmtUsd) : ''}</div>

                <div class="rp-sec"><h2>API requests</h2><div class="rp-kpis">
                    ${kpi(fmtN(a.total), 'Requests')}${kpi(a.total ? (((a.total - a.server_errors) / a.total) * 100).toFixed(1) + '%' : '-', 'Availability (no server error)')}${kpi(fmtN(a.server_errors), 'Server errors (5xx)')}</div>
                    <div class="rp-note">Availability is the share of requests answered without a server error (5xx). Not found or invalid requests (4xx): ${fmtN(Math.max(0, a.errors - a.server_errors))}, mostly links that do not exist, are counted separately. Server errors (5xx) are failures on the platform side.</div>
                    ${a.by_endpoint.length ? `<table><thead><tr><th>Endpoint</th><th class="n">Requests</th><th class="n">Server errors</th></tr></thead><tbody>${a.by_endpoint.map((e) => `<tr><td>${esc(e.endpoint)}</td><td class="n">${fmtN(e.total)}</td><td class="n">${fmtN(e.server_errors || 0)}</td></tr>`).join('')}</tbody></table>` : '<div class="rp-note">No API requests counted in this period. Counting started when the feature was released.</div>'}
                    ${printBars('Requests per ' + (d.unit === 'month' ? 'month' : 'day'), d.api_buckets, d.unit === 'month' ? 'month' : 'day', [{ name: 'Requests', values: a.series_total, color: S1 }])}</div>

                <div class="rp-sec"><h2>Storage (${esc(lim.plan)})</h2>
                    ${meter('Database', st.db_bytes, lim.db_bytes)}${meter('File storage', st.storage_bytes, lim.storage_bytes)}
                    <div class="rp-note">Storage is the level at generation time, as a percent of the plan quota.</div>
                <div class="rp-foot">Prepared by Netlink for internal use. May be shared with prospective investors and partners to evaluate or carry out cooperation with Netlink. Please use it only for that purpose and do not share it further without Netlink's written permission. Unaudited. Figures come from Netlink's own records.</div></div>


            </div>`;
        }

        // Calendar reports always show the whole period: 12 months for a year, every day for a month.
        // The overview only returns buckets up to today, so the rest is padded with zeros (no bar).
        function padPeriod(d, kind, period) {
            const pad2 = (n) => String(n).padStart(2, '0');
            let full, apiFull;
            if (kind === 'year') {
                full = Array.from({ length: 12 }, (_, i) => `${period}-${pad2(i + 1)}-01T00:00`);
                apiFull = full.map((b) => b.slice(0, 10));
            } else {
                const y = Number(period.slice(0, 4)), m = Number(period.slice(5, 7));
                const days = new Date(y, m, 0).getDate();
                full = Array.from({ length: days }, (_, i) => `${period}-${pad2(i + 1)}T00:00`);
                apiFull = full.map((b) => b.slice(0, 10));
            }
            const fit = (arr, oldB, newB) => { const at = new Map(oldB.map((b, i) => [b, i])); return newB.map((b) => { const i = at.get(b); return i === undefined ? 0 : Number(arr?.[i]) || 0; }); };
            const oldB = d.buckets, oldA = d.api_buckets;
            if (!oldB || oldB.length >= full.length) return d;
            d.users.series_new = fit(d.users.series_new, oldB, full);
            d.users.series_kyc = fit(d.users.series_kyc, oldB, full);
            if (d.users.series_total) d.users.series_total = fit(d.users.series_total, oldB, full);
            d.pay.series_tx = fit(d.pay.series_tx, oldB, full);
            d.finance.series_orders = fit(d.finance.series_orders, oldB, full);
            d.finance.series_revenue = fit(d.finance.series_revenue, oldB, full);
            d.api.series_total = fit(d.api.series_total, oldA, apiFull);
            d.buckets = full;
            d.api_buckets = apiFull;
            return d;
        }

        async function printReport(kind, period) {
            const [d, polUsd, idr] = await Promise.all([
                api('admin-overview', { query: `&range=${encodeURIComponent(kind)}&period=${encodeURIComponent(period)}` }),
                fetchPolUsd(), fetchIdrRate(),
            ]);
            const label = kind === 'month' ? period : period;
            $('printReport').innerHTML = reportHtml(padPeriod(d, kind, period), kind, period, polUsd, idr, currentProfileName);
            const prevTitle = document.title;
            document.title = `Netlink ${kind === 'month' ? 'Monthly' : 'Yearly'} Report ${label}`;
            const restore = () => { document.title = prevTitle; $('printReport').innerHTML = ''; window.removeEventListener('afterprint', restore); };
            window.addEventListener('afterprint', restore);
            await new Promise((r) => setTimeout(r, 150)); // let the browser lay out the SVG before printing
            window.print();
        }
        $('printBtn').addEventListener('click', openPrintDialog);
        $('testMailBtn').addEventListener('click', async () => {
            const b = $('testMailBtn'); b.disabled = true;
            try { const r = await api('admin-test-email', { method: 'POST', body: {} }); alert('Test email sent to ' + r.to); }
            catch (e) { alert(e.message || 'Could not send the test email'); }
            finally { b.disabled = false; }
        });

        // ---------- volume in USD with IDR below (same sources as pay.html) ----------
        const FX_TTL_MS = 10 * 60 * 1000;
        const FX_PRIMARY_URL = 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json';
        const FX_FALLBACK_URL = 'https://latest.currency-api.pages.dev/v1/currencies/usd.json';
        let fxCache = { rate: null, at: 0 };
        let polCache = { price: null, at: 0 };

        async function fetchIdrRate() {
            if (fxCache.rate && Date.now() - fxCache.at < FX_TTL_MS) return fxCache.rate;
            for (const url of [FX_PRIMARY_URL, FX_FALLBACK_URL]) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('fx source failed');
                    const rate = (await res.json()).usd?.idr;
                    if (!rate) throw new Error('no idr rate');
                    fxCache = { rate, at: Date.now() };
                    return rate;
                } catch (err) { console.warn('FX source failed:', err.message); }
            }
            return null;
        }

        async function fetchPolUsd() {
            if (polCache.price && Date.now() - polCache.at < FX_TTL_MS) return polCache.price;
            try {
                const res = await fetch('/api/pol-price');
                if (!res.ok) throw new Error('pol-price failed');
                const json = await res.json();
                if (!json.pol_usd) throw new Error('no pol_usd');
                polCache = { price: json.pol_usd, at: Date.now() };
                return json.pol_usd;
            } catch (err) { console.warn('POL price failed:', err.message); return null; }
        }

        // USDC counts 1:1, POL at the current price, a swap uses its USDC side. NET has no USD price.
        function computeVolume(rows, polUsd) {
            const out = { send: { usd: 0, net: 0, n: 0 }, receive: { usd: 0, net: 0, n: 0 }, swap: { usd: 0, net: 0, n: 0 }, polMissing: false };
            for (const r of rows || []) {
                const b = out[r.type]; if (!b) continue;
                b.n += Number(r.count) || 0;
                const amt = Number(r.amount) || 0, to = Number(r.to_amount) || 0;
                const pol = (x) => { if (polUsd) return x * polUsd; out.polMissing = true; return 0; };
                if (r.type === 'swap') {
                    if (r.token === 'USDC') b.usd += amt;
                    else if (r.to_token === 'USDC') b.usd += to;
                    else if (r.token === 'POL') b.usd += pol(amt);
                    else if (r.token === 'NET') b.net += amt;
                } else if (r.token === 'USDC') b.usd += amt;
                else if (r.token === 'POL') b.usd += pol(amt);
                else if (r.token === 'NET') b.net += amt;
            }
            return out;
        }

        const fmtUsd = (v) => '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fmtIdr = (usd, rate) => (rate ? '≈ Rp ' + Math.round(usd * rate).toLocaleString('id-ID') : '');

        // Income = order revenue + swap commission (received on the fee wallet, read from Polygon by the daily job)
        function fillIncome(d, polUsd, idr, order) {
            const box = $('incomeBlock'); if (!box) return;
            const fee = feeSummary(d.pay.fee_income, d.buckets, polUsd);
            const tl = (usd, label, sub) => `<div class="card tile"><div class="v text-primary">${fmtUsd(usd)}</div><div class="l">${esc(label)}</div>${idr ? `<div class="s">${esc(fmtIdr(usd, idr))}</div>` : ''}${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>`;
            const rev = d.finance.series_revenue.map(Number);
            const per = d.unit === 'month' ? 'month' : d.unit === 'hour' ? 'hour' : 'day';
            if (!fee) {
                box.innerHTML = `<p class="text-xs text-muted mb-2">Swap commission has not been synced from the blockchain yet. The daily job reads it once a day.</p>`;
                return;
            }
            box.innerHTML = `<div class="tiles">
                ${tl(order, 'Order revenue', fmtN(d.finance.paid_in_range) + ' paid orders')}
                ${tl(fee.usd, 'Swap commission', fmtN(fee.swaps) + ' swaps, ' + fee.pol.toFixed(2) + ' POL + ' + fmtUsd(fee.usdc))}
                ${tl(order + fee.usd, 'Total income', '')}
            </div>
            ${chartHtml('Order revenue per ' + per + ' (USD)', d.buckets, d.unit, [{ name: 'Order revenue', values: rev, color: 'var(--series-1)' }], fmtUsd)}
            ${chartHtml('Swap commission per ' + per + ' (USD)', d.buckets, d.unit, [{ name: 'Swap commission', values: fee.series, color: 'var(--series-2)' }], fmtUsd)}
            ${chartHtml('Total income per ' + per + ' (USD)', d.buckets, d.unit, [{ name: 'Total income', values: fee.series.map((x, i) => x + (rev[i] || 0)), color: 'var(--series-3)' }], fmtUsd)}
            <p class="text-xs text-muted mb-2">Swap commission is the fee received on the Netlink fee wallet on Polygon (${esc(FEE_WALLET_SHORT)}). Only transfers that belong to a swap made in Netlink Pay are counted${d.pay.fee_unmatched ? ' (' + fmtN(d.pay.fee_unmatched) + ' other incoming transfers are left out)' : ''}. USDC counts 1:1, POL uses the current price. Amounts are what was received, before any costs.</p>`;
        }

        async function fillVolume(d) {
            const box = $('volBlock'); if (!box) return;
            const [polUsd, idr] = await Promise.all([fetchPolUsd(), fetchIdrRate()]);
            if (d.range !== ovRange || !$('volBlock')) return; // user switched range meanwhile
            const v = computeVolume(d.pay.tx_volume, polUsd);
            const order = Number(d.finance.revenue_in_range) || 0;
            const overall = v.send.usd + v.receive.usd + v.swap.usd;
            const netTotal = v.send.net + v.receive.net + v.swap.net;
            fillIncome(d, polUsd, idr, order);
            const vt = (usd, label, sub, wide) => `<div class="card tile"${wide ? ' style="grid-column: 1 / -1"' : ''}><div class="v text-primary">${fmtUsd(usd)}</div><div class="l">${esc(label)}</div><div class="s">${esc(fmtIdr(usd, idr))}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>`;
            box.innerHTML = `<div class="tiles">
                ${vt(overall, 'Total volume, all', fmtN(v.send.n + v.receive.n + v.swap.n) + ' transactions', true)}
                ${vt(v.send.usd, 'Send', fmtN(v.send.n) + ' transactions')}
                ${vt(v.receive.usd, 'Receive', fmtN(v.receive.n) + ' transactions')}
                ${vt(v.swap.usd, 'Swap', fmtN(v.swap.n) + ' transactions')}
                ${vt(order, 'Order', fmtN(d.finance.paid_in_range) + ' paid orders')}
            </div>
            <p class="text-xs text-muted mb-2">${netTotal ? 'NET moved: ' + fmtN(netTotal) + ' NET, not valued in USD because NET has no market price. ' : ''}${v.polMissing ? 'POL price is unavailable right now, so POL amounts are left out. ' : ''}${idr ? '' : 'IDR rate is unavailable right now. '}USDC counts 1:1, POL uses the current price, and a swap uses its USDC side. Overall is Send + Receive + Swap. A transfer between two Netlink users appears in both Send and Receive, and Order paid from Netlink Pay is also inside Send.</p>`;
        }

        // ---------- overview ----------
        let ovRange = '7d';
        const nf = new Intl.NumberFormat('en-US');
        const fmtN = (v) => nf.format(Math.round(Number(v) || 0));
        const fmtBytes = (b) => { b = Number(b) || 0; return b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : (b / 1048576).toFixed(1) + ' MB'; };
        const TIER_LABEL = { basic: 'Basic', silver: 'Silver', gold: 'Gold', platinum: 'Platinum' };

        document.querySelectorAll('#rangeBtns .range-btn').forEach((b) => b.addEventListener('click', () => {
            ovRange = b.dataset.range;
            document.querySelectorAll('#rangeBtns .range-btn').forEach((x) => x.classList.toggle('active', x === b));
            loadOverview();
        }));

        function bucketLabel(iso, unit) {
            const d = new Date(iso.length === 10 ? iso + 'T00:00' : iso);
            if (unit === 'hour') return String(d.getHours()).padStart(2, '0') + ':00';
            if (unit === 'month') return d.toLocaleString('en-US', { month: 'short', year: '2-digit' });
            return d.toLocaleString('en-US', { day: 'numeric', month: 'short' });
        }

        // Grouped bar chart as inline SVG. series: [{ name, values, color }]
        function chartHtml(title, buckets, unit, series, fmt) {
            fmt = fmt || fmtN;
            const W = 600, H = 150, L = 6, R = 6, T = 8, B = 20;
            const n = buckets.length || 1;
            const max = Math.max(1, ...series.flatMap((s) => s.values.map(Number)));
            const slot = (W - L - R) / n;
            const gap = Math.min(4, slot * 0.2);
            const bw = Math.max(2, (slot - gap) / series.length - (series.length > 1 ? 1 : 0));
            let bars = '', hits = '';
            buckets.forEach((b, i) => {
                series.forEach((s, k) => {
                    const v = Number(s.values[i]) || 0;
                    const h = v ? Math.max(2, (v / max) * (H - T - B)) : 0;
                    const x = L + i * slot + gap / 2 + k * (bw + 1);
                    if (h) bars += `<rect x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color}"/>`;
                });
                hits += `<rect class="hit" data-i="${i}" x="${(L + i * slot).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H - B}" fill="transparent"/>`;
            });
            const step = Math.max(1, Math.ceil(n / 6));
            let ax = '';
            buckets.forEach((b, i) => { if (i % step === 0 || (i === n - 1 && (n - 1) % step >= Math.ceil(step / 2))) ax += `<text class="ax" x="${(L + i * slot + slot / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${esc(bucketLabel(b, unit))}</text>`; });
            const legend = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
            const total = series.map((s) => `${s.name}: ${fmt(s.values.reduce((a, v) => a + Number(v), 0))}`).join(' · ');
            const rows = buckets.map((b, i) => `<tr><td>${esc(bucketLabel(b, unit))}</td>${series.map((s) => `<td class="n">${fmt(s.values[i])}</td>`).join('')}</tr>`).join('');
            const id = 'c' + Math.random().toString(36).slice(2, 8);
            queueMicrotask(() => wireChart(id, buckets, unit, series, fmt));
            return `<div class="card chart-card" id="${id}">
                <h4 class="text-primary">${esc(title)}</h4>${legend}
                <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(title + '. ' + total)}">
                    <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--grid)"/>${bars}${ax}${hits}</svg>
                <div class="tip"></div>
                <details class="tbl"><summary>View as table</summary><table class="mini"><thead><tr><th></th>${series.map((s) => `<th class="n">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></details>
            </div>`;
        }

        function wireChart(id, buckets, unit, series, fmt) {
            const card = document.getElementById(id); if (!card) return;
            const tip = card.querySelector('.tip'); const svg = card.querySelector('svg');
            card.querySelectorAll('.hit').forEach((r) => {
                const show = () => {
                    const i = Number(r.dataset.i);
                    tip.innerHTML = `<b>${esc(bucketLabel(buckets[i], unit))}</b><br>` + series.map((s) => `${esc(s.name)}: ${fmt(s.values[i])}`).join('<br>');
                    const sr = svg.getBoundingClientRect(), cr = card.getBoundingClientRect(), rr = r.getBoundingClientRect();
                    const x = rr.left + rr.width / 2 - cr.left;
                    tip.style.left = Math.min(Math.max(4, x - 40), cr.width - 110) + 'px';
                    tip.style.top = (sr.top - cr.top + 10) + 'px';
                    tip.classList.add('on');
                };
                r.addEventListener('mouseenter', show); r.addEventListener('click', show);
                r.addEventListener('mouseleave', () => tip.classList.remove('on'));
            });
        }

        const tile = (v, l, s, opts = {}) => {
            const tag = opts.go ? 'button' : 'div';
            return `<${tag} class="card tile${opts.alert ? ' alert' : ''}"${opts.go ? ` data-go="${opts.go}"` : ''}${opts.wide ? ' style="grid-column: 1 / -1"' : ''}><div class="v text-primary">${v}</div><div class="l">${esc(l)}</div>${s ? `<div class="s">${s}</div>` : ''}</${tag}>`;
        };

        function meterRow(label, used, limit) {
            const pct = limit ? (used / limit) * 100 : 0;
            const cls = pct >= 90 ? 'crit' : pct >= 70 ? 'warn' : '';
            const note = pct >= 90 ? ' (almost full)' : pct >= 70 ? ' (getting full)' : '';
            return `<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span class="text-primary font-semibold">${esc(label)}</span><span class="text-secondary">${fmtBytes(used)} of ${fmtBytes(limit)} · ${pct < 0.1 && used ? '<0.1' : pct.toFixed(1)}%${note}</span></div><div class="meter"><div class="${cls}" style="width:${Math.min(100, Math.max(used ? 1 : 0, pct)).toFixed(1)}%"></div></div></div>`;
        }

        // All-time summary of the daily on-chain check of recorded transactions (null when unavailable).
        function onchainHtml(oc) {
            if (!oc) return '';
            const pct = oc.total ? Math.round((oc.verified / oc.total) * 100) : 0;
            return `<div class="tiles">
                ${tile(fmtN(oc.verified) + ' / ' + fmtN(oc.total), 'Verified on-chain', pct + '% of successful transactions, all time', { wide: true })}
                ${tile(fmtN(oc.pending), 'Waiting to be verified', 'Checked once a day')}
                ${tile(fmtN(oc.flagged), 'Flagged', 'Not found or reverted on-chain', { alert: oc.flagged > 0 })}
                ${tile(fmtN(oc.not_seen), 'Wallet not seen', 'Confirmed on-chain, wallet not in receipt')}
            </div>
            <div class="tiles">
                ${tile(fmtN(oc.amount_match) + ' / ' + fmtN(oc.verified), 'Amount matches on-chain', (oc.verified ? Math.round((oc.amount_match / oc.verified) * 100) : 0) + '% of verified transactions', { wide: true })}
                ${tile(fmtN(oc.amount_mismatch), 'Amount mismatch', 'Recorded amount differs from on-chain', { alert: oc.amount_mismatch > 0 })}
                ${tile(fmtN(oc.amount_unchecked), 'Amount not confirmed', 'Swap, older wallet or no transfer found')}
                ${tile(fmtN(oc.amount_pending), 'Amount not checked yet', 'Checked once a day')}
            </div><p class="text-xs text-muted mb-2">Verified means the transaction exists and succeeded on Polygon. The amount check compares the recorded amount with the on-chain transfers of that transaction. Swaps, and transfers from a wallet the user has since replaced, can stay not confirmed. A mismatch needs a manual look. Figures are all time, not limited to the selected range. Smart wallet and internal transfers may show as wallet not seen.</p>`;
        }

        function renderOverview(d) {
            const u = d.users, p = d.pay, f = d.finance, a = d.api, st = d.storage, lim = d.limits;
            const rangeName = { today: 'today', '7d': 'last 7 days', '30d': 'last 30 days', '1y': 'last 12 months' }[d.range];
            const tiers = ['basic', 'silver', 'gold', 'platinum'].filter((t) => t === 'basic' || t === 'silver' || t === 'gold' || u.tiers[t]);
            const kycPct = u.total ? (u.kyc / u.total) * 100 : 0;
            let h = '';

            h += `<div class="ov-title">Users</div><div class="tiles">
                ${tile(fmtN(u.total), 'Total users', 'All accounts, KYC verified or not', { wide: true })}
                ${tile(fmtN(u.kyc), 'KYC verified', fmtN(u.kyc_in_range) + ' new, ' + rangeName)}
                ${tile(fmtN(u.non_kyc), 'Not KYC verified', (u.total ? 100 - kycPct : 0).toFixed(0) + '% of users')}
                ${tile(fmtN(u.new_in_range), 'New users, ' + rangeName, '')}
                ${tile(kycPct.toFixed(0) + '%', 'KYC rate', '')}
            </div>
            <div class="tiles">${tiers.map((t) => tile(fmtN(u.tiers[t] || 0), TIER_LABEL[t] + ' users', 'Current plan')).join('')}</div>
            ${countriesHtml(u)}
            ${chartHtml('New users and KYC verified', d.buckets, d.unit, [{ name: 'New users', values: u.series_new, color: 'var(--series-1)' }, { name: 'KYC verified', values: u.series_kyc, color: 'var(--series-2)' }])}`;

            h += `<div class="ov-title">Finance</div><div class="tiles">
                ${tile(fmtN(f.orders_in_range), 'Orders, ' + rangeName, fmtN(f.orders_total) + ' in total', { go: 'orders' })}
                ${tile('$' + Number(f.revenue_in_range).toFixed(2), 'Paid USDC, ' + rangeName, fmtN(f.paid_in_range) + ' paid orders (tests excluded)', { go: 'payments' })}
                ${tile(fmtN(f.unmatched_payments), 'Payments to review', f.awaiting ? fmtN(f.awaiting) + ' orders awaiting payment' : 'Nothing waiting', { go: 'payments', alert: f.unmatched_payments > 0 })}
                ${has('super_admin') ? tile(fmtN(f.audit_in_range), 'Audit log entries, ' + rangeName, '', { go: 'audit' }) : tile(fmtN(f.awaiting), 'Awaiting payment', '')}
            </div><div id="incomeBlock"><p class="text-xs text-muted mb-2">Loading income...</p></div>${chartHtml('Orders', d.buckets, d.unit, [{ name: 'Orders', values: f.series_orders, color: 'var(--series-1)' }])}`;

            const types = Object.entries(p.tx_by_type || {}).sort((x, y) => y[1] - x[1]).map(([k, v]) => `${esc(k)} ${fmtN(v)}`).join(' · ');
            h += `<div class="ov-title">Netlink Pay</div><div class="tiles">
                ${tile(fmtN(p.wallets), 'Wallets connected', fmtN(u.total ? (p.wallets / u.total) * 100 : 0) + '% of users')}
                ${tile(fmtN(p.tx_in_range), 'Transactions, ' + rangeName, fmtN(p.tx_total) + ' in total')}
                <div class="card tile" style="grid-column: span 2"><div class="l">Transaction types, ${esc(rangeName)}</div><div class="s text-secondary" style="font-size:13px;margin-top:4px">${types || 'No transactions'}</div></div>
            </div><div id="volBlock"><p class="text-xs text-muted mb-2">Loading volume...</p></div>${onchainHtml(p.onchain)}${chartHtml('Transactions', d.buckets, d.unit, [{ name: 'Transactions', values: p.series_tx, color: 'var(--series-1)' }])}
            <p class="text-xs text-muted mb-2">Counts transactions recorded by Netlink Pay. Transfers made outside the app are not included.</p>`;

            const rate = a.total ? ((a.errors / a.total) * 100).toFixed(1) : '0.0';
            h += `<div class="ov-title">API requests</div><div class="tiles">
                ${tile(fmtN(a.total), 'Requests, ' + rangeName, '')}
                ${tile(fmtN(a.errors), 'Errors (4xx and 5xx)', rate + '% of requests')}
                ${tile(fmtN(a.server_errors), 'Server errors (5xx)', '', { alert: a.server_errors > 0 })}
            </div>${chartHtml('Requests per day', d.api_buckets, d.unit === 'month' ? 'month' : 'day', [{ name: 'Requests', values: a.series_total, color: 'var(--series-1)' }])}
            <div class="card chart-card"><h4 class="text-primary">By endpoint</h4>${a.by_endpoint.length ? `<table class="mini"><thead><tr><th>Endpoint</th><th class="n">Requests</th><th class="n">Errors</th><th class="n">Error rate</th></tr></thead><tbody>${a.by_endpoint.map((e) => `<tr><td class="mono">${esc(e.endpoint)}</td><td class="n">${fmtN(e.total)}</td><td class="n">${fmtN(e.errors)}</td><td class="n">${e.total ? ((e.errors / e.total) * 100).toFixed(1) : '0.0'}%</td></tr>`).join('')}</tbody></table>` : '<p class="text-xs text-muted">No requests counted yet.</p>'}
                ${a.by_action.length ? `<details class="tbl"><summary>By action (successful requests)</summary><table class="mini"><tbody>${a.by_action.map((e) => `<tr><td class="mono">${esc(e.endpoint)} / ${esc(e.action)}</td><td class="n">${fmtN(e.total)}</td></tr>`).join('')}</tbody></table></details>` : ''}
            </div><p class="text-xs text-muted mb-2">Counting started when this feature was released, so earlier requests are not included. Image rendering (og) is not counted.</p>`;

            h += `<div class="ov-title">Storage (${esc(lim.plan)})</div><div class="card chart-card">
                ${meterRow('Database', st.db_bytes, lim.db_bytes)}${meterRow('File storage', st.storage_bytes, lim.storage_bytes)}
                <p class="text-xs text-muted">Percent of the plan quota. Bandwidth and monthly active users are not shown here.</p></div>`;

            h += '<div id="usageBlock"></div>';
            h += notFoundShell();
            $('overview').innerHTML = h;
            loadUsage();
            wireNotFound();
            $('overview').querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.go)));
            fillVolume(d);
        }

        // ---------- usage and limits (third party APIs against plan limits) ----------
        // Shown on screen only, never in the printed report. Alchemy compute units are an estimate
        // counted by our own server (see api/_lib/usage.js); compare with the Alchemy dashboard.
        let usageCache = { at: 0, data: null };

        function usageMeter(label, used, limit, usedText, note, limitHint) {
            const pct = limit ? (used / limit) * 100 : 0;
            const cls = pct >= 90 ? 'crit' : pct >= 70 ? 'warn' : '';
            const hint = pct >= 90 ? (limitHint || ' (plan upgrade needed soon)') : pct >= 70 && !limitHint ? ' (start planning an upgrade)' : '';
            return `<div class="mb-3"><div class="flex justify-between text-sm mb-1 gap-2"><span class="text-primary font-semibold">${esc(label)}</span><span class="text-secondary" style="text-align:right">${esc(usedText)} · ${pct > 0 && pct < 0.1 ? '<0.1' : pct.toFixed(1)}%${hint}</span></div><div class="meter"><div class="${cls}" style="width:${Math.min(100, Math.max(used ? 1 : 0, pct)).toFixed(1)}%"></div></div>${note ? `<p class="text-xs text-muted mt-1">${esc(note)}</p>` : ''}</div>`;
        }

        // planLocked: the key works (WalletsTotal loaded) but this figure is refused, which means the
        // endpoint is not part of the current Sequence plan. If the key itself fails, say so instead.
        function seqTile(label, part, sub, planLocked) {
            if (!part) return tile('n/a', label, 'Not loaded');
            if (part.status === 'ok') return tile(part.value === null ? 'n/a' : fmtN(part.value), label, sub);
            const code = `HTTP ${part.http || 'error'}${part.detail ? ': ' + esc(part.detail) : ''}`;
            if (part.status === 'denied' && planLocked) return tile('Not on this plan', label, `Needs a higher Sequence plan. ${code}`);
            if (part.status === 'denied') return tile('Key refused', label, `Check SEQUENCE_SECRET_API_KEY. ${code}`);
            return tile('n/a', label, code);
        }

        function usageHtml(u) {
            if (!u) return '';
            const L = u.limits || {};
            let h = '<div class="ov-title">Usage and limits</div>';
            h += '<div class="card chart-card">';
            if (u.alchemy) {
                h += usageMeter('Alchemy compute units, this month (UTC)', u.alchemy.cu, L.alchemy_cu_month, `${fmtN(u.alchemy.cu)} of ${fmtN(L.alchemy_cu_month)} CU`, 'Estimate counted by our server. Compare with the Alchemy dashboard.');
            }
            if (u.supabase) {
                h += usageMeter('Supabase monthly active users (last 30 days)', u.supabase.mau_30d, L.supabase_mau, `${fmtN(u.supabase.mau_30d)} of ${fmtN(L.supabase_mau)} users`, 'Users who signed in during the last 30 days.');
            }
            if (u.vercel) {
                h += usageMeter('Vercel serverless functions (Hobby)', u.vercel.functions_used, u.vercel.functions_limit, `${u.vercel.functions_used} of ${u.vercel.functions_limit}`, 'At the limit means a new endpoint has to be added as an action of an existing function.', ' (at the limit)');
            }
            h += '</div>';

            h += '<div class="tiles">';
            if (u.alchemy) {
                h += tile(fmtN(u.alchemy.rate_limited), 'Alchemy rate limit hits (429)', u.alchemy.last_rate_limited_day ? `Last on ${esc(u.alchemy.last_rate_limited_day)}. Peak limit is ${fmtN(L.alchemy_cu_per_second)} CU per second.` : `None this month. Peak limit is ${fmtN(L.alchemy_cu_per_second)} CU per second.`, { alert: u.alchemy.rate_limited > 0 });
                h += tile(fmtN(u.alchemy.requests), 'Alchemy requests, this month', 'Counted by our server');
            }
            if (u.didit) h += tile(fmtN(u.didit.sessions_month), 'Didit sessions, this month', `${fmtN(u.didit.sessions_total)} in total (billed per session)`);
            if (u.netlink_pay) {
                h += tile(fmtN(u.netlink_pay.wallets_connected), 'Wallets connected', 'Netlink Pay accounts with a wallet');
                h += tile(fmtN(u.netlink_pay.tx_month), 'Netlink Pay transactions, this month', `${fmtN(u.netlink_pay.tx_total)} in total`);
            }
            h += '</div>';

            if (u.alchemy && u.alchemy.by_method && u.alchemy.by_method.length) {
                h += `<details class="tbl"><summary>Alchemy by method (estimated CU)</summary><table class="mini"><tbody>${u.alchemy.by_method.map((m) => `<tr><td class="mono">${esc(m.method)}</td><td class="n">${fmtN(m.n)} calls</td><td class="n">${fmtN(m.cu)} CU</td></tr>`).join('')}</tbody></table></details>`;
            }

            h += '<div class="ov-title">Sequence</div>';
            const q = u.sequence;
            if (!q) h += '<p class="text-xs text-muted mb-2">Sequence figures could not be loaded.</p>';
            else if (!q.configured) h += '<p class="text-xs text-muted mb-2">Not configured. Add SEQUENCE_SECRET_API_KEY in Vercel to show wallets and usage from the Sequence Analytics API.</p>';
            else {
                const keyWorks = !!(q.wallets_total && q.wallets_total.status === 'ok');
                const fallback = q.key_source === 'TRAILS_API_KEY' ? '<p class="text-xs text-muted mb-2">The Trails key is being used as a fallback. Add SEQUENCE_SECRET_API_KEY in Vercel.</p>' : '';
                h += `${fallback}<div class="tiles">${seqTile('Wallets (all time)', q.wallets_total, '', keyWorks)}${seqTile('Active wallets, this month', q.wallets_active_month, '', keyWorks)}${seqTile('Wallets with a transaction, this month', q.wallets_with_tx_month, '', keyWorks)}${seqTile('Compute, this month', q.compute_month, 'Sequence usage unit', keyWorks)}</div>`;
            }
            h += '<p class="text-xs text-muted mb-2">Plan limits are constants in api/_lib/usage.js. Sequence usage charts in its own dashboard need a paid plan, so the figures here come from its Analytics API when the key allows it.</p>';
            return h;
        }

        async function loadUsage() {
            const box = $('usageBlock');
            if (!box) return;
            try {
                if (!usageCache.data || Date.now() - usageCache.at > 60000) {
                    box.innerHTML = '<div class="ov-title">Usage and limits</div><p class="text-xs text-muted mb-2">Loading...</p>';
                    usageCache = { at: Date.now(), data: await api('admin-usage') };
                }
                const again = $('usageBlock');
                if (again) again.innerHTML = usageHtml(usageCache.data);
            } catch (err) {
                const again = $('usageBlock');
                if (again) again.innerHTML = '<div class="ov-title">Usage and limits</div><p class="text-xs text-muted mb-2">Could not load usage figures.</p>';
            }
        }

        // ---------- bio page 404 log (button, loads on demand) ----------
        // Data comes from bio_not_found_daily (written by api/bio.js on every 404).
        let nfDays = 7;

        function notFoundShell() {
            return `<div class="ov-title">Bio page 404s</div><div class="card chart-card">
                <p class="text-xs text-muted mb-2">Usernames people opened that do not exist. A name that does not look like a real username (for example wp-admin or .env) is a bot probe. Counting started when this feature was released.</p>
                <div class="flex gap-2 flex-wrap mb-2" id="nfRange">
                    <button type="button" class="range-btn" data-d="1">Today</button>
                    <button type="button" class="range-btn active" data-d="7">7D</button>
                    <button type="button" class="range-btn" data-d="30">30D</button>
                    <button type="button" id="nfLoad" class="btn" style="margin-left:auto">Load 404 log</button>
                </div>
                <div id="nfResult"></div></div>`;
        }

        function nfHtml(d) {
            if (!d.total) return '<p class="text-xs text-muted">No 404s recorded in this period yet.</p>';
            const probePct = d.total ? Math.round((d.probe_total / d.total) * 100) : 0;
            const tiles = `<div class="tiles">
                ${tile(fmtN(d.total), '404s in period', '')}
                ${tile(fmtN(d.distinct), 'Different names', '')}
                ${tile(probePct + '%', 'Bot probes', fmtN(d.probe_total) + ' of ' + fmtN(d.total) + ' (invalid username format)')}
                ${tile(fmtN(d.total - d.probe_total), 'Valid format, not found', 'Mistyped links or removed profiles')}
            </div>`;
            const chart = d.per_day.length > 1
                ? chartHtml('404s per day', d.per_day.map((x) => x.day), 'day', [{ name: '404s', values: d.per_day.map((x) => x.count), color: 'var(--series-1)' }])
                : '';
            const rows = d.top.map((x) => `<tr><td class="mono">${esc(x.username)}</td><td class="n">${fmtN(x.count)}</td><td class="n">${fmtN(x.days)}</td><td><span class="badge ${x.probe ? 'b-warn' : 'b-gray'}">${x.probe ? 'Probe' : 'Valid format'}</span></td></tr>`).join('');
            const note = d.truncated ? '<p class="text-xs text-muted mt-2">Very large log, the list may be incomplete.</p>' : '';
            return `${tiles}${chart}<div class="card chart-card"><h4 class="text-primary">Top 30 names</h4><table class="mini"><thead><tr><th>Name</th><th class="n">404s</th><th class="n">Days</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table>${note}</div>`;
        }

        async function loadNotFound() {
            const box = $('nfResult'); const btn = $('nfLoad');
            if (!box || !btn) return;
            btn.disabled = true; btn.textContent = 'Loading...';
            box.innerHTML = '<p class="text-xs text-muted">Loading...</p>';
            try {
                const d = await api('admin-404-log', { query: `&days=${nfDays}` });
                const again = $('nfResult'); if (again) again.innerHTML = nfHtml(d);
            } catch (err) {
                const again = $('nfResult'); if (again) again.innerHTML = `<p class="text-xs text-red-500">${esc(err.message || 'Could not load the 404 log')}</p>`;
            }
            const b = $('nfLoad'); if (b) { b.disabled = false; b.textContent = 'Load 404 log'; }
        }

        function wireNotFound() {
            document.querySelectorAll('#nfRange .range-btn').forEach((b) => b.addEventListener('click', () => {
                nfDays = Number(b.dataset.d);
                document.querySelectorAll('#nfRange .range-btn').forEach((x) => x.classList.toggle('active', x === b));
            }));
            const load = $('nfLoad'); if (load) load.addEventListener('click', loadNotFound);
        }

        async function loadOverview() {
            show('ovError', false);
            try {
                const d = await api('admin-overview', { query: `&range=${encodeURIComponent(ovRange)}` });
                setUnmatchedBadge(d.finance.unmatched_payments);
                renderOverview(d);
            } catch (err) { $('ovError').textContent = err.message; show('ovError', true); $('overview').innerHTML = ''; }
        }

        // ---------- orders ----------
        async function loadOrders() {
            const list = $('orderList');
            list.innerHTML = '<p class="p-4 text-sm text-muted">Loading...</p>';
            try {
                const q = encodeURIComponent($('orderSearch').value.trim());
                const st = encodeURIComponent($('orderStatus').value);
                const { orders } = await api('admin-orders', { query: `&q=${q}&status=${st}` });
                if (!orders.length) { list.innerHTML = '<p class="p-4 text-sm text-muted">No orders found.</p>'; return; }
                list.innerHTML = orders.map((o) => `
                    <button class="row" data-order="${esc(o.id)}">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-sm font-semibold text-primary mono">${esc(o.order_no)}</span>
                            <span class="badge ${STATUS_CLASS[o.status] || 'b-gray'}">${esc(STATUS_LABEL[o.status] || o.status)}</span>
                        </div>
                        <div class="flex items-center justify-between gap-2 mt-1 text-xs text-muted">
                            <span>${esc(o.type === 'plan' && o.meta && o.meta.plan ? planLabel(o.meta.plan) : (TYPE_LABEL[o.type] || o.type))} · ${esc(o.user ? '@' + o.user.username : 'unknown user')}${o.meta && o.meta.test ? ' · test' : ''}</span>
                            <span>${fmtUsdc(o.paid_amount)} / ${fmtUsdc(o.amount_usdc)} · ${esc(fmtDate(o.created_at))}</span>
                        </div>
                    </button>`).join('');
                list.querySelectorAll('button[data-order]').forEach((b) => b.addEventListener('click', () => openOrder(b.dataset.order)));
            } catch (err) { list.innerHTML = `<p class="p-4 text-sm text-red-500">${esc(err.message)}</p>`; }
        }

        let searchTimer = null;
        $('orderSearch').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadOrders, 350); });
        $('orderStatus').addEventListener('change', loadOrders);

        function kv(k, v, mono) { return `<div class="kv"><span>${esc(k)}</span><span${mono ? ' class="mono"' : ''}>${v}</span></div>`; }

        async function openOrder(id) {
            openModal('<p class="text-sm text-muted">Loading...</p>');
            try {
                const d = await api('admin-order', { query: `&order_id=${encodeURIComponent(id)}` });
                const o = d.order;
                const u = o.user || {};
                const sessions = (d.sessions || []).map((s) => `<div class="kv"><span>${esc(fmtDate(s.created_at))}</span><span class="mono">${esc(s.didit_session_id)} <button class="text-blue-500" data-copy="${esc(s.didit_session_id)}">Copy</button></span></div>`).join('') || '<p class="text-xs text-muted">No Didit session yet.</p>';
                const verifs = (d.verifications || []).map((v) => `<div class="kv"><span>${esc(fmtDate(v.created_at))}</span><span>${esc(v.raw_status || v.status)}</span></div>`).join('') || '<p class="text-xs text-muted">No verification results yet.</p>';
                const pays = (d.payments || []).map((p) => `<div class="py-2 border-b border-subtle"><div class="flex justify-between text-sm"><span class="font-semibold text-primary">${fmtUsdc(p.amount)}</span><span class="badge ${PAY_CLASS[p.match_status] || 'b-gray'}">${esc(p.match_status)}</span></div><div class="mono text-muted mt-1">${esc(p.tx_hash)}</div><div class="text-xs text-muted">${esc(fmtDate(p.occurred_at))} from ${esc(shortAddr(p.from_address))}${p.admin_note ? ' · ' + esc(p.admin_note) : ''}</div></div>`).join('');
                const canLate = isFinance() && o.status === 'late_payment';
                const isPlan = o.type === 'plan' && o.meta && o.meta.plan;
                openModal(`
                    <div class="flex items-start justify-between mb-3">
                        <div><p class="text-base font-bold text-primary mono">${esc(o.order_no)}</p>
                        <span class="badge ${STATUS_CLASS[o.status] || 'b-gray'}">${esc(STATUS_LABEL[o.status] || o.status)}</span></div>
                        <button id="closeModalBtn" class="text-muted text-sm" aria-label="Close">Close</button>
                    </div>
                    ${kv('Type', esc(TYPE_LABEL[o.type] || o.type))}
                    ${isPlan ? kv('Plan', esc(planLabel(o.meta.plan))) : ''}
                    ${isPlan ? kv('Active until', esc(o.meta.plan.active_until ? fmtDate(o.meta.plan.active_until) : 'Not activated yet')) : ''}
                    ${kv('User', esc(u.username ? '@' + u.username : '-') + (u.display_name ? ' (' + esc(u.display_name) + ')' : ''))}
                    ${kv('Email', esc(d.email || '-'))}
                    ${kv('Identity status', esc(u.identity_status || '-'))}
                    ${kv('Amount', fmtUsdc(o.amount_usdc))}
                    ${kv('Paid so far', fmtUsdc(o.paid_amount))}
                    ${kv('Method', esc(o.pay_method || '-'))}
                    ${kv('Payer wallet', esc(o.payer_address || '-'), true)}
                    ${kv('Paid tx', esc(o.paid_tx_hash || '-'), true)}
                    ${kv('Created', esc(fmtDate(o.created_at)))}
                    ${kv('Expires', esc(fmtDate(o.expires_at)))}
                    ${kv('Paid at', esc(fmtDate(o.paid_at)))}
                    ${kv('Fulfilled', esc(fmtDate(o.fulfilled_at)))}
                    ${o.meta && o.meta.test ? kv('Flag', 'Test order') : ''}
                    ${isPlan ? '' : `<h4 class="text-sm font-semibold text-primary mt-4 mb-1">Didit sessions</h4>
                    ${sessions}
                    <h4 class="text-sm font-semibold text-primary mt-4 mb-1">Verification results</h4>
                    ${verifs}`}
                    ${d.payments ? `<h4 class="text-sm font-semibold text-primary mt-4 mb-1">Payments</h4>${pays || '<p class="text-xs text-muted">No payments recorded.</p>'}` : ''}
                    ${canLate ? `<div class="mt-4"><button id="acceptLateBtn" class="btn">Accept late payment</button></div>` : ''}
                `);
                $('closeModalBtn').addEventListener('click', closeModal);
                $('modalBox').querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => copy(b.dataset.copy)));
                if (canLate) $('acceptLateBtn').addEventListener('click', () => askNote({
                    title: 'Accept late payment',
                    text: 'The payment arrived after the order expired. Accepting counts it as on time. A note is required.',
                    confirm: 'Accept',
                    run: async (note) => { await api('admin-accept-late', { method: 'POST', body: { order_id: o.id, note } }); showToast('Late payment accepted'); openOrder(o.id); loadOrders(); },
                }));
            } catch (err) { openModal(`<p class="text-sm text-red-500 mb-3">${esc(err.message)}</p><button id="closeModalBtn" class="btn btn-ghost">Close</button>`); $('closeModalBtn').addEventListener('click', closeModal); }
        }

        // Reusable "note required" confirm dialog.
        function askNote({ title, text, confirm, run, extra = '', extraSetup }) {
            openModal(`
                <h3 class="text-base font-bold text-primary mb-1">${esc(title)}</h3>
                <p class="text-xs text-muted mb-3">${esc(text)}</p>
                ${extra}
                <label class="text-xs text-muted">Note (required)</label>
                <textarea id="noteInput" class="field mt-1 mb-3" rows="3" maxlength="500"></textarea>
                <p id="noteErr" class="text-xs text-red-500 mb-2 hidden"></p>
                <div class="flex gap-2 justify-end"><button id="noteCancel" class="btn btn-ghost">Cancel</button><button id="noteOk" class="btn">${esc(confirm)}</button></div>`);
            if (extraSetup) extraSetup();
            $('noteCancel').addEventListener('click', closeModal);
            $('noteOk').addEventListener('click', async () => {
                const note = $('noteInput').value.trim();
                const err = $('noteErr');
                if (!note) { err.textContent = 'Please write a note.'; err.classList.remove('hidden'); return; }
                $('noteOk').disabled = true;
                try { await run(note); } catch (e) { err.textContent = e.message; err.classList.remove('hidden'); $('noteOk').disabled = false; }
            });
        }

        // ---------- payments ----------
        let payCache = [];
        async function loadPayments() {
            const list = $('paymentList');
            list.innerHTML = '<p class="p-4 text-sm text-muted">Loading...</p>';
            try {
                const st = $('payStatus').value;
                const { payments } = await api('admin-payments', { query: `&status=${encodeURIComponent(st)}` });
                payCache = payments;
                if (!payments.length) { list.innerHTML = '<p class="p-4 text-sm text-muted">Nothing here.</p>'; return; }
                list.innerHTML = payments.map((p) => {
                    const actions = !p.order_id && (p.match_status === 'unmatched')
                        ? `<div class="flex gap-2 mt-2"><button class="btn" data-link="${esc(p.id)}">Link to order</button><button class="btn btn-ghost" data-ignore="${esc(p.id)}">Ignore</button></div>` : '';
                    return `<div class="row">
                        <div class="flex justify-between text-sm"><span class="font-semibold text-primary">${fmtUsdc(p.amount)} USDC</span><span class="badge ${PAY_CLASS[p.match_status] || 'b-gray'}">${esc(p.match_status)}</span></div>
                        <div class="mono text-muted mt-1">${esc(p.tx_hash)} <button class="text-blue-500" data-copy="${esc(p.tx_hash)}">Copy</button></div>
                        <div class="text-xs text-muted">${esc(fmtDate(p.occurred_at))} from <span class="mono">${esc(p.from_address)}</span>${p.order_no ? ' · order ' + esc(p.order_no) : ''}${p.admin_note ? ' · ' + esc(p.admin_note) : ''}</div>
                        ${actions}</div>`;
                }).join('');
                list.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => copy(b.dataset.copy)));
                list.querySelectorAll('[data-link]').forEach((b) => b.addEventListener('click', () => linkFlow(b.dataset.link)));
                list.querySelectorAll('[data-ignore]').forEach((b) => b.addEventListener('click', () => askNote({
                    title: 'Ignore payment', text: 'Use this for transfers that are not for any order. It stays in the log.', confirm: 'Ignore',
                    run: async (note) => { await api('admin-ignore-payment', { method: 'POST', body: { payment_id: b.dataset.ignore, note } }); closeModal(); showToast('Payment ignored'); loadPayments(); refreshMe(); },
                })));
            } catch (err) { list.innerHTML = `<p class="p-4 text-sm text-red-500">${esc(err.message)}</p>`; }
        }
        $('payStatus').addEventListener('change', loadPayments);

        function linkFlow(paymentId) {
            const p = payCache.find((x) => x.id === paymentId);
            let chosen = null;
            askNote({
                title: 'Link payment to order',
                text: `${p ? fmtUsdc(p.amount) + ' USDC from ' + shortAddr(p.from_address) : ''}. Search the order number, then pick it.`,
                confirm: 'Link payment',
                extra: `<input id="linkSearch" class="field mb-2" placeholder="Order number, e.g. NL-260929" maxlength="20" autocomplete="off"><div id="linkResults" class="mb-3 card rounded-xl overflow-hidden hidden"></div><p id="linkChosen" class="text-xs text-primary mb-3 hidden"></p>`,
                extraSetup: () => {
                    let t = null;
                    $('linkSearch').addEventListener('input', () => {
                        clearTimeout(t);
                        t = setTimeout(async () => {
                            const q = $('linkSearch').value.trim();
                            if (q.length < 3) { show('linkResults', false); return; }
                            try {
                                const { orders } = await api('admin-orders', { query: `&q=${encodeURIComponent(q)}&limit=8` });
                                const usable = orders.filter((o) => ['awaiting_payment', 'underpaid', 'expired', 'late_payment'].includes(o.status));
                                $('linkResults').innerHTML = usable.length ? usable.map((o) => `<button class="row" data-pick="${esc(o.id)}" data-no="${esc(o.order_no)}"><span class="mono">${esc(o.order_no)}</span> <span class="badge ${STATUS_CLASS[o.status]}">${esc(STATUS_LABEL[o.status])}</span> <span class="text-xs text-muted">${esc(o.user ? '@' + o.user.username : '')} ${fmtUsdc(o.paid_amount)} / ${fmtUsdc(o.amount_usdc)}</span></button>`).join('') : '<p class="p-3 text-xs text-muted">No open orders match.</p>';
                                show('linkResults', true);
                                $('linkResults').querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => {
                                    chosen = b.dataset.pick;
                                    $('linkChosen').textContent = 'Selected: ' + b.dataset.no;
                                    show('linkChosen', true); show('linkResults', false);
                                }));
                            } catch (e) { showToast(e.message, true); }
                        }, 350);
                    });
                },
                run: async (note) => {
                    if (!chosen) throw new Error('Pick an order first');
                    const { order } = await api('admin-link-payment', { method: 'POST', body: { payment_id: paymentId, order_id: chosen, note } });
                    closeModal(); showToast(`Linked. Order is now ${STATUS_LABEL[order.status] || order.status}`); loadPayments(); refreshMe();
                },
            });
        }

        $('syncBtn').addEventListener('click', async () => {

            try {
                const r = await api('admin-sync', { method: 'POST' });

        // ---------- ambassadors ----------
        const AMB_STATUS_LABEL = { pending: 'Pending', under_review: 'Under review', approved: 'Approved', rejected: 'Rejected', revoked: 'Revoked' };
        const AMB_STATUS_CLASS = { pending: 'b-info', under_review: 'b-warn', approved: 'b-ok', rejected: 'b-gray', revoked: 'b-bad' };
        const AMB_TRACK_LABEL = { growth: 'Growth', content: 'Content', community: 'Community', influence: 'Influence' };
        const AMB_AUDIENCE_LABEL = { under_1k: 'Under 1,000', '1k_10k': '1,000 to 10,000', '10k_100k': '10,000 to 100,000', over_100k: 'Over 100,000' };
        // Next steps per status (mirrors AMBASSADOR_FLOW on the server and the database trigger).
        const AMB_ACTIONS = {
            pending: [
                { to: 'under_review', label: 'Start review', text: 'Move this application to under review. A note is required.' },
                { to: 'rejected', label: 'Reject', text: 'The applicant will see "Not selected". A note is required.', ghost: true },
            ],
            under_review: [
                { to: 'approved', label: 'Approve', text: 'The applicant becomes a Netlink ambassador. A note is required.' },
                { to: 'rejected', label: 'Reject', text: 'The applicant will see "Not selected". A note is required.', ghost: true },
            ],
            approved: [
                { to: 'revoked', label: 'Revoke status', text: 'Ambassador status ends. This cannot be undone. A note is required.', danger: true },
            ],
        };
        const canReviewAmb = () => has('super_admin');

        function ambCountryName(code) {
            const hit = (window.NETLINK_COUNTRIES || []).find((c) => c[0] === code);
            return hit ? hit[1] : (code || '-');
        }
        function safeHref(url) { return /^https?:\/\//i.test(String(url || '')) ? String(url) : null; }

        function renderAmbCounts(counts) {
            if (!counts) return;
            const open = (counts.pending || 0);
            const html = open ? ` <span class="badge b-warn" style="margin-left:4px">${Number(open)}</span>` : '';
            ['badge-ambassadors', 'badge-community'].forEach((id) => { const el = $(id); if (el) el.innerHTML = html; });
            $('ambCounts').textContent = Object.keys(AMB_STATUS_LABEL).map((k) => `${AMB_STATUS_LABEL[k]} ${counts[k] || 0}`).join(' · ');
        }

        async function refreshAmbBadge() {
            try { const r = await api('admin-ambassadors', { query: '&limit=1' }); renderAmbCounts(r.counts); } catch (e) { /* non-fatal */ }

        async function loadAmbassadors() {

                list.innerHTML = applications.map((a) => {

                        <div class="flex items-center justify-between gap-2">

                            <span class="badge ${AMB_STATUS_CLASS[a.status] || 'b-gray'}">${esc(AMB_STATUS_LABEL[a.status] || a.status)}</span>
                        </div>
                        <div class="flex items-center justify-between gap-2 mt-1 text-xs text-muted">
                            <span>${esc(typeof netlinkCountryFlag === 'function' ? netlinkCountryFlag(a.country_code) : '')} ${esc(ambCountryName(a.country_code))} · ${esc(AMB_TRACK_LABEL[a.track] || a.track)}</span>

            } catch (err) { list.innerHTML = `<p class="p-4 text-sm text-red-500">${esc(err.message)}</p>`; }
        }

        let ambTimer = null;
        $('ambSearch').addEventListener('input', () => { clearTimeout(ambTimer); ambTimer = setTimeout(loadAmbassadors, 350); });
        $('ambStatus').addEventListener('change', loadAmbassadors);

        // Links are publicly readable (same as the bio page), so the admin page reads them directly.
        async function loadAmbBioLinks(userId) {
            const box = $('ambBioLinks');
            try {
                const { data, error } = await supabaseClient.from('links')
                    .select('title, url').eq('user_id', userId).eq('is_active', true).order('position', { ascending: true }).limit(20);
                if (error) throw error;
                if (!box) return;
                if (!data || !data.length) { box.innerHTML = '<p class="text-xs text-muted">No links on their bio yet.</p>'; return; }
                box.innerHTML = data.map((l) => {
                    const href = safeHref(l.url);
                    return `<div class="kv"><span>${esc(l.title || '-')}</span><span class="mono">${href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer nofollow" class="text-blue-500">${esc(l.url)}</a>` : esc(l.url)}</span></div>`;
                }).join('');
            } catch (err) {
                const el = $('ambBioLinks');
                if (el) el.innerHTML = '<p class="text-xs text-muted">Could not load their links.</p>';
            }
        }

        async function openAmbassador(id) {
            openModal('<p class="text-sm text-muted">Loading...</p>');
            try {
                const d = await api('admin-ambassador', { query: `&id=${encodeURIComponent(id)}` });
                const a = d.application;
                const u = a.user || {};
                const linkHtml = (l) => {
                    const href = safeHref(l);
                    return href

                const bioUrl = u.username ? `https://netlink.bio/${u.username}` : null;
                const cvUrl = u.username ? `https://netlink.bio/cv/${u.username}` : null;
                const extraLinks = (a.social_links || []).filter((l) => l !== bioUrl).map(linkHtml).join('');
                const canAct = canReviewAmb();

                openModal(`
                    <div class="flex items-start justify-between mb-3">
                        <div><p class="text-base font-bold text-primary">${esc(u.username ? '@' + u.username : 'Unknown user')}</p>
                        <span class="badge ${AMB_STATUS_CLASS[a.status] || 'b-gray'}">${esc(AMB_STATUS_LABEL[a.status] || a.status)}</span></div>
                        <button id="closeModalBtn" class="text-muted text-sm" aria-label="Close">Close</button>
                    </div>
                    ${kv('Name', esc(u.display_name || '-'))}
                    ${kv('Email', esc(d.email || '-'))}
                    ${kv('Net ID', esc(u.net_id || '-'), true)}
                    ${kv('Referral code', esc(u.referral_code || '-'), true)}
                    ${kv('Plan', esc(u.tier || '-'))}
                    ${kv('Identity', esc(u.identity_status || '-'))}
                    ${kv('Member since', esc(fmtDate(u.joined_at)))}
                    <h4 class="text-sm font-semibold text-primary mt-4 mb-1">Application</h4>
                    ${kv('Season', esc(a.season))}
                    ${kv('Submitted', esc(fmtDate(a.created_at)))}
                    ${kv('Last review', esc(fmtDate(a.reviewed_at)))}
                    ${kv('Country', esc(ambCountryName(a.country_code)) + (a.city ? ', ' + esc(a.city) : ''))}
                    ${kv('Track', esc(AMB_TRACK_LABEL[a.track] || a.track))}
                    ${kv('Audience', esc(AMB_AUDIENCE_LABEL[a.audience_size] || a.audience_size))}
                    ${kv('Bio page', bioUrl ? linkHtml(bioUrl) : '-')}
                    ${kv('CV', cvUrl ? linkHtml(cvUrl) : '-')}
                    ${extraLinks ? kv('Link in application', extraLinks) : ''}
                    <h4 class="text-sm font-semibold text-primary mt-4 mb-1">Links on their bio</h4>
                    <div id="ambBioLinks"><p class="text-xs text-muted">Loading...</p></div>
                    <h4 class="text-sm font-semibold text-primary mt-4 mb-1">Why they want to apply</h4>

                    <h4 class="text-sm font-semibold text-primary mt-4 mb-1">How they would contribute</h4>
                    <p class="text-sm text-secondary" style="white-space:pre-wrap">${esc(a.contribution_plan)}</p>

                    <textarea id="ambNotes" class="field" rows="4" maxlength="2000" ${canAct ? '' : 'readonly'}></textarea>
                    ${canAct ? '<div class="mt-2"><button id="ambSaveNotes" class="btn btn-ghost">Save notes</button></div>' : ''}
                    ${actions.length ? `<div class="mt-4 flex gap-2 flex-wrap">${actions.map((x, i) => `<button class="btn${x.danger ? ' btn-danger' : x.ghost ? ' btn-ghost' : ''}" data-act="${i}">${esc(x.label)}</button>`).join('')}</div>` : ''}

                $('ambNotes').value = a.admin_notes || '';

                if (canAct) {
                    $('ambSaveNotes').addEventListener('click', async () => {

                        catch (err) { showToast(err.message, true); }
                        btn.disabled = false;
                    });
                }
                $('modalBox').querySelectorAll('button[data-act]').forEach((b) => b.addEventListener('click', () => {
                    const act = actions[Number(b.dataset.act)];
