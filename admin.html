                        title: act.label,
                        text: act.text,
                        confirm: act.label,
                        run: async (note) => {
                            await api('admin-ambassador-update', { method: 'POST', body: { id: a.id, status: act.to, note } });
                            showToast('Application updated');
                            openAmbassador(a.id);
                            loadAmbassadors();
                        },
                    });
                }));
            } catch (err) { openModal(`<p class="text-sm text-red-500 mb-3">${esc(err.message)}</p><button id="closeModalBtn" class="btn btn-ghost">Close</button>`); $('closeModalBtn').addEventListener('click', closeModal); }
        }

        // ---------- rewards ----------
        // Read only. Finance sees who claimed a NET reward, filters the ones not paid yet, and exports
        // the recipients (TokenPocket batch paste or CSV). Marking a claim as paid is still done by hand.
        const RW_ADDR_RE = /^0x[0-9a-fA-F]{40}$/;
        const RW_STATUS_LABEL = { pending: 'Not received', claimed: 'Received' };
        const RW_STATUS_CLASS = { pending: 'b-warn', claimed: 'b-ok' };
        let rwRows = [];

        const fmtNet = (v) => String(Number(Number(v).toFixed(6)));
        const rwHasWallet = (r) => !!(r.user && RW_ADDR_RE.test(r.user.wallet_address || ''));
        // Only claims that are still unpaid and have a valid wallet may go into a payout paste.
        const rwPayable = () => rwRows.filter((r) => r.status === 'pending' && rwHasWallet(r));

        // Stops a spreadsheet from running a cell that starts with = + - @ as a formula.
        function csvCell(v) {
            let s = String(v ?? '');
            if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
            return `"${s.replace(/"/g, '""')}"`;
        }

        function updateRwActions() {
            const payable = rwPayable();
            const pendingRows = rwRows.filter((r) => r.status === 'pending');
            const noWallet = pendingRows.length - payable.length;
            const seen = new Map();
            payable.forEach((r) => { const k = r.user.wallet_address.toLowerCase(); seen.set(k, (seen.get(k) || 0) + 1); });
            const dup = [...seen.values()].filter((n) => n > 1).length;
            const warns = [];
            if (noWallet > 0) warns.push(`${noWallet} unpaid claim${noWallet === 1 ? ' has' : 's have'} no valid wallet and ${noWallet === 1 ? 'is' : 'are'} left out of the paste.`);
            if (dup > 0) warns.push(`${dup} wallet address${dup === 1 ? ' appears' : 'es appear'} more than once. Check before sending.`);
            $('rwWarn').textContent = warns.join(' ');
            show('rwWarn', warns.length > 0);
            const total = payable.reduce((s, r) => s + r.amount, 0);
            $('rwCopyBtn').disabled = payable.length === 0;
            $('rwCopyBtn').textContent = payable.length ? `Copy for TokenPocket (${payable.length}, ${fmtNet(total)} NET)` : 'Copy for TokenPocket';
            $('rwCsvBtn').disabled = rwRows.length === 0;
        }

        async function loadRewards() {
            const list = $('rwList');
            list.innerHTML = '<p class="p-4 text-sm text-muted">Loading...</p>';
            try {
                const q = encodeURIComponent($('rwSearch').value.trim());
                const st = encodeURIComponent($('rwStatus').value);
                const { rewards, counts } = await api('admin-rewards', { query: `&q=${q}&status=${st}` });
                rwRows = rewards;
                $('rwCounts').textContent = `Not received ${counts.pending} (${fmtNet(counts.pending_amount)} NET) · Received ${counts.claimed} · Total ${counts.total}`;
                updateRwActions();
                if (!rewards.length) { list.innerHTML = '<p class="p-4 text-sm text-muted">No claims found.</p>'; return; }
                list.innerHTML = rewards.map((r) => {
                    const u = r.user || {};
                    const addr = u.wallet_address || '';
                    const addrHtml = RW_ADDR_RE.test(addr)
                        ? `<span class="mono">${esc(addr)}</span>`
                        : '<span class="text-red-500">No valid wallet</span>';
                    const txHtml = r.tx_hash
                        ? ` · <a href="https://polygonscan.com/tx/${encodeURIComponent(r.tx_hash)}" target="_blank" rel="noopener noreferrer" class="text-blue-500">View transaction</a>`
                        : '';
                    return `
                    <div class="row">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-sm font-semibold text-primary">${esc(u.username ? '@' + u.username : 'unknown user')}${u.display_name ? ' <span class="text-xs text-muted font-normal">' + esc(u.display_name) + '</span>' : ''}</span>
                            <span class="badge ${RW_STATUS_CLASS[r.status] || 'b-gray'}">${esc(RW_STATUS_LABEL[r.status] || r.status)}</span>
                        </div>
                        <div class="mt-1 text-xs text-muted">${addrHtml}</div>
                        <div class="flex items-center justify-between gap-2 mt-1 text-xs text-muted">
                            <span>${esc(fmtNet(r.amount))} NET · ${esc(fmtDate(r.created_at))}${txHtml}</span>
                        </div>
                    </div>`;
                }).join('');
            } catch (err) { list.innerHTML = `<p class="p-4 text-sm text-red-500">${esc(err.message)}</p>`; }
        }

        // TokenPocket batch transfer: one line per transfer, "address,amount".
        $('rwCopyBtn').addEventListener('click', () => {
            const payable = rwPayable();
            if (!payable.length) return;
            const text = payable.map((r) => `${r.user.wallet_address},${fmtNet(r.amount)}`).join('\n');
            const total = payable.reduce((s, r) => s + r.amount, 0);
            navigator.clipboard.writeText(text).then(
                () => showToast(`Copied ${payable.length} recipient${payable.length === 1 ? '' : 's'}, ${fmtNet(total)} NET`),
                () => showToast('Could not copy', true),
            );
        });

        // CSV of the rows currently listed (all columns, including already received ones).
        $('rwCsvBtn').addEventListener('click', () => {
            if (!rwRows.length) return;
            const head = ['username', 'display_name', 'wallet_address', 'amount_net', 'status', 'tx_hash', 'claimed_at', 'created_at'];
            const lines = [head.join(',')].concat(rwRows.map((r) => {
                const u = r.user || {};
                return [u.username, u.display_name, u.wallet_address, fmtNet(r.amount), r.status, r.tx_hash, r.claimed_at, r.created_at].map(csvCell).join(',');
            }));
            const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `netlink-rewards-${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        // Detect payments: the server reads real NET transfers from the reward wallet and matches them
        // to unpaid claims. Confirming sends only claim ids; the server writes the tx hash itself.
        function renderRwDetect(d) {
            const matches = d.matches || [];
            const unmatched = d.unmatched || [];
            const total = matches.reduce((s, m) => s + m.amount, 0);
            const rows = matches.map((m) => `
                <div class="row">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-sm font-semibold text-primary">${esc(m.username ? '@' + m.username : 'unknown user')}</span>
                        <span class="text-sm">${esc(fmtNet(m.amount))} NET</span>
                    </div>
                    <div class="text-xs text-muted" style="margin-top:4px"><a href="https://polygonscan.com/tx/${encodeURIComponent(m.tx_hash)}" target="_blank" rel="noopener noreferrer" class="text-blue-500 mono">${esc(shortAddr(m.tx_hash))}</a> · ${esc(fmtDate(m.paid_at))}</div>
                </div>`).join('');
            const skipped = unmatched.length
                ? `<p class="text-xs text-muted" style="margin-top:12px">${unmatched.length} unpaid claim${unmatched.length === 1 ? '' : 's'} had no matching transfer and ${unmatched.length === 1 ? 'is' : 'are'} left as not received.</p>`
                : '';
            openModal(`
                <h3 class="text-base font-semibold text-primary">Detected payments</h3>
                <p class="text-xs text-muted" style="margin:4px 0 12px">Sent from ${esc(shortAddr(d.wallet))}. A claim matches a NET transfer to the claimant's wallet for the exact claim amount.</p>
                ${matches.length ? `<div class="card rounded-2xl overflow-hidden">${rows}</div>` : '<p class="text-sm text-muted">No matching payments found.</p>'}
                ${skipped}
                <div style="display:flex;gap:8px;margin-top:16px">
                    ${matches.length ? `<button id="rwConfirmBtn" type="button" class="btn">Mark ${matches.length} as received (${esc(fmtNet(total))} NET)</button>` : ''}
                    <button id="rwCloseBtn" type="button" class="btn btn-ghost">Close</button>
                </div>`);
            $('rwCloseBtn').addEventListener('click', closeModal);
            const confirmBtn = $('rwConfirmBtn');
            if (confirmBtn) {
                confirmBtn.addEventListener('click', async () => {
                    confirmBtn.disabled = true;
                    try {
                        const r = await api('admin-rewards-confirm', { method: 'POST', body: { reward_ids: matches.map((m) => m.reward_id) } });
                        closeModal();
                        showToast(`Marked ${r.confirmed} as received${r.skipped ? `, ${r.skipped} skipped` : ''}`);
                        loadRewards();
                    } catch (err) {
                        confirmBtn.disabled = false;
                        showToast(err.message, true);
                    }
                });
            }
        }

        $('rwDetectBtn').addEventListener('click', async () => {
            openModal('<p class="text-sm text-muted">Checking the blockchain...</p>');
            try {
                renderRwDetect(await api('admin-rewards-detect'));
            } catch (err) {
                openModal(`<p class="text-sm text-red-500">${esc(err.message)}</p><div style="margin-top:16px"><button id="rwCloseBtn" type="button" class="btn btn-ghost">Close</button></div>`);
                $('rwCloseBtn').addEventListener('click', closeModal);
            }
        });

        let rwTimer = null;
        $('rwSearch').addEventListener('input', () => { clearTimeout(rwTimer); rwTimer = setTimeout(loadRewards, 350); });
        $('rwStatus').addEventListener('change', loadRewards);

        // ---------- audit ----------
        async function loadAudit() {
            const list = $('auditList');
            list.innerHTML = '<p class="p-4 text-sm text-muted">Loading...</p>';
            try {
                const { entries } = await api('admin-audit', { query: '&limit=100' });
                if (!entries.length) { list.innerHTML = '<p class="p-4 text-sm text-muted">No entries yet.</p>'; return; }
                list.innerHTML = entries.map((e) => {
                    const d = e.detail || {};
                    const bits = [];
                    if (d.note) bits.push('Note: ' + d.note);
                    if (d.amount) bits.push('Amount: ' + d.amount);
                    if (d.order_status) bits.push('Order: ' + d.order_status);
                    if (d.transfers_seen !== undefined) bits.push(`Seen ${d.transfers_seen}, changed ${d.orders_changed}`);
                    if (d.to) bits.push(`Application: ${d.from} to ${d.to}`);
                    if (e.action === 'reward_paid') bits.push(`${d.count} claims marked received, ${d.total_net} NET`);
                    return `<div class="row"><div class="flex justify-between text-sm"><span class="font-semibold text-primary">${esc(e.action)}</span><span class="text-xs text-muted">${esc(fmtDate(e.created_at))}</span></div><div class="text-xs text-muted">${esc(String(e.admin))} (${esc(e.role)})${bits.length ? ' · ' + esc(bits.join(' · ')) : ''}</div></div>`;
                }).join('');
            } catch (err) { list.innerHTML = `<p class="p-4 text-sm text-red-500">${esc(err.message)}</p>`; }
        }

        // ---------- boot ----------
        async function refreshMe() {
            try { const me = await api('admin-me'); setUnmatchedBadge(me.unmatched_payments); } catch (e) { /* non-fatal */ }
        }

        async function boot() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error) throw error;
                if (!session) { leaveAdmin(); return; }
                currentUser = session.user;
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('username, display_name, avatar_url, tier, tier_expires_at, net_id, local_currency, wallet_address, identity_verification_status, identity_verified_at, business_verified_at')
                    .eq('id', currentUser.id).single();
                if (window.NetlinkNav && profile) NetlinkNav.init({ activePage: null, profile, supabaseClient, userId: currentUser.id });

                currentProfileName = (profile?.display_name || '').trim() || profile?.username || '';
                let me;
                try { me = await api('admin-me'); } catch (e) { if (e.status === 401 || e.status === 403) { leaveAdmin(); return; } throw e; }
                roles = me.roles || [];
                if (!roles.length) { leaveAdmin(); return; }
                $('authGate').style.display = 'none';
                $('roleBadges').innerHTML = roles.map((r) => `<span class="badge b-info">${esc(r.replace('_', ' '))}</span>`).join('');
                show('adminView', true);
                if (isFinance()) show('printBtn', true);
                if (has('super_admin')) show('testMailBtn', true);
                buildTabs();
                setUnmatchedBadge(me.unmatched_payments);
                if (has('super_admin', 'support')) refreshAmbBadge();
                if (window.lucide) lucide.createIcons();
            } catch (err) { console.error(err); showAuthError(err.message || String(err)); }
        }
        boot();
    </script>
    <script src="/shared/account-menu.js?v=6"></script>
    <script src="/shared/nav.js?v=8"></script>
</body>
</html>
