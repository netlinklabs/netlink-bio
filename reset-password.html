<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Netlink.bio</title>
    <link rel="icon" type="image/png" href="/assets/netlinkbio-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; }
        .tosca { color: #14b8a6; }
        .bg-tosca { background-color: #14b8a6; }
        .hover-bg-tosca-dark:hover { background-color: #0d9488; }
        .toast {
            position: fixed; bottom: 20px; right: 20px; left: 20px;
            max-width: 360px; margin-left: auto;
            background: #ef4444; color: white; padding: 12px 20px;
            border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transform: translateY(100px); transition: transform 0.3s; z-index: 60;
        }
        .toast.show { transform: translateY(0); }
        .toast.success { background: #10b981; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="toast" class="toast"></div>

    <div class="w-full max-w-sm">
        <a href="index.html" class="flex items-center justify-center mb-8">
            <img src="https://raw.githubusercontent.com/netlinklabs/netlink-bio/refs/heads/main/assets/netlinkbio-lightBG.png" alt="Netlink.bio" class="h-9">
        </a>

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">

            <div id="loadingView" class="text-center py-6">
                <i data-lucide="loader-2" class="w-8 h-8 tosca animate-spin mx-auto mb-3"></i>
                <p class="text-sm text-gray-500">Verifying your reset link...</p>
            </div>

            <div id="resetView" class="hidden">
                <div class="text-center mb-6">
                    <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-tosca/10 flex items-center justify-center">
                        <i data-lucide="key-round" class="w-6 h-6 tosca"></i>
                    </div>
                    <h2 class="font-poppins text-lg font-bold text-gray-800">Set a new password</h2>
                    <p class="text-sm text-gray-500 mt-1">Choose a new password for your account.</p>
                </div>

                <form id="resetForm" class="space-y-4">
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1.5">New password</label>
                        <div class="relative">
                            <input id="newPassword" type="password" required minlength="6" placeholder="••••••••"
                                class="w-full px-4 py-2.5 pr-11 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-tosca/30 focus:border-tosca transition">
                            <button type="button" id="toggleNewPassword" onclick="togglePasswordVisibility('newPassword')" aria-label="Show password"
                                class="absolute right-0 top-0 h-full w-11 flex items-center justify-center text-gray-400 hover:text-gray-600 transition">
                                <i id="toggleNewPasswordIcon" data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1.5">Confirm new password</label>
                        <div class="relative">
                            <input id="confirmPassword" type="password" required minlength="6" placeholder="••••••••"
                                class="w-full px-4 py-2.5 pr-11 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-tosca/30 focus:border-tosca transition">
                            <button type="button" id="toggleConfirmPassword" onclick="togglePasswordVisibility('confirmPassword')" aria-label="Show password"
                                class="absolute right-0 top-0 h-full w-11 flex items-center justify-center text-gray-400 hover:text-gray-600 transition">
                                <i id="toggleConfirmPasswordIcon" data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <p id="resetError" class="hidden text-sm text-red-500"></p>
                    <button id="resetSubmitBtn" type="submit"
                        class="w-full py-3 bg-tosca hover-bg-tosca-dark text-white font-semibold rounded-xl transition flex items-center justify-center gap-2">
                        <span id="resetSubmitLabel">Update password</span>
                        <i id="resetSubmitSpinner" data-lucide="loader-2" class="w-4 h-4 animate-spin hidden"></i>
                    </button>
                </form>
            </div>

            <div id="invalidView" class="hidden text-center py-4">
                <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-red-50 flex items-center justify-center">
                    <i data-lucide="alert-triangle" class="w-6 h-6 text-red-500"></i>
                </div>
                <h2 class="font-poppins text-lg font-bold text-gray-800">Link invalid</h2>
                <p class="text-sm text-gray-500 mt-1 mb-5">This reset link is invalid or has expired.</p>
                <a href="login.html" class="tosca font-medium text-sm hover:underline">Back to login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://fuewalufgiclrcgszlit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_FcmN6iwrOJp-5KBtBU8Cww_ZtvzahQb';
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showToast(message, isSuccess = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.toggle('success', isSuccess);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function togglePasswordVisibility(fieldId) {
            const idPrefix = fieldId.charAt(0).toUpperCase() + fieldId.slice(1);
            const input = document.getElementById(fieldId);
            const icon = document.getElementById(`toggle${idPrefix}Icon`);
            const btn = document.getElementById(`toggle${idPrefix}`);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
            btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            lucide.createIcons();
        }
        window.togglePasswordVisibility = togglePasswordVisibility;

        function showResetForm() {
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('invalidView').classList.add('hidden');
            document.getElementById('resetView').classList.remove('hidden');
        }

        function showInvalidLink() {
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('resetView').classList.add('hidden');
            document.getElementById('invalidView').classList.remove('hidden');
        }

        let recoveryConfirmed = false;

        window.supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                recoveryConfirmed = true;
                showResetForm();
            }
        });

        // Fallback: if no PASSWORD_RECOVERY event fires within a few seconds
        // (e.g. the page was opened directly without a token), show the
        // invalid-link state.
        setTimeout(() => {
            if (!recoveryConfirmed) showInvalidLink();
        }, 4000);

        function setResetLoading(isLoading) {
            document.getElementById('resetSubmitSpinner').classList.toggle('hidden', !isLoading);
        }

        function showResetError(message) {
            const el = document.getElementById('resetError');
            el.textContent = message;
            el.classList.remove('hidden');
        }

        function hideResetError() {
            const el = document.getElementById('resetError');
            el.textContent = '';
            el.classList.add('hidden');
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideResetError();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showResetError('Password must be at least 6 characters.');
                return;
            }
            if (newPassword !== confirmPassword) {
                showResetError('Passwords do not match.');
                return;
            }

            document.getElementById('resetSubmitBtn').disabled = true;
            setResetLoading(true);
            try {
                const { error } = await window.supabaseClient.auth.updateUser({ password: newPassword });
                if (error) throw error;
                showToast('Password updated successfully.', true);
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } catch (err) {
                showToast(err.message || 'Something went wrong. Please try again.');
                document.getElementById('resetSubmitBtn').disabled = false;
                setResetLoading(false);
            }
        });
    </script>
</body>
</html>
