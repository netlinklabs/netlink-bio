        .receipt-actions button { flex: 1; padding: 10px 0; border-radius: 12px; font-size: 12px; font-weight: 600; transition: all 0.15s ease; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 6px; }

            .receipt-modal-wrap { max-width: 100%; }

<body class="min-h-screen">
    <div id="authGate">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://fuewalufgiclrcgszlit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_FcmN6iwrOJp-5KBtBU8Cww_ZtvzahQb';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const BRAND_LOGO_URL = 'https://raw.githubusercontent.com/netlinklabs/netlink-pay/refs/heads/main/asset/netlinkpay-lightbg.png';
        const TOKEN_LOGOS = {
            'USDC': 'https://raw.githubusercontent.com/netlinklabs/netlink-bio/refs/heads/main/assets/usdc-logo.png',
            'POL': 'https://raw.githubusercontent.com/netlinklabs/netlink-bio/refs/heads/main/assets/polygon-logo.png',
            'MATIC': 'https://raw.githubusercontent.com/netlinklabs/netlink-bio/refs/heads/main/assets/polygon-logo.png',
            'NET': 'https://raw.githubusercontent.com/netlinklabs/netlink-bio/refs/heads/main/assets/net-logo.png',
            'NETLINK': 'https://raw.githubusercontent.com/netlinklabs/netlink-bio/refs/heads/main/assets/net-logo.png',
        };

        let currentUser = null, currentProfile = null, allTx = [], currentFilter = 'all', currentPage = 1;
        let currentModalTx = null, currentTxStatus = 'Success';

        function showAuthError(msg) { document.getElementById('authGateText').textContent = 'Something went wrong: ' + msg; }
        window.addEventListener('error', (e) => showAuthError(e.message));
        window.addEventListener('unhandledrejection', (e) => showAuthError(e.reason?.message || String(e.reason)));
        function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
        function truncateAddress(addr) { return addr ? addr.slice(0, 6) + '...' + addr.slice(-4) : ''; }
        function formatFintech(num, decimals) { const n = parseFloat(num); return isNaN(n) ? String(num) : n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }
        function getTokenLogo(token) { return TOKEN_LOGOS[(token || '').toUpperCase()] || TOKEN_LOGOS['NET']; }

        async function checkAuth() {
            try { const { data: { session }, error } = await supabaseClient.auth.getSession(); if (error) throw error; if (!session) { window.location.href = 'login.html'; return; } currentUser = session.user; document.getElementById('authGate').style.display = 'none'; await loadUserProfile(); }
            catch (err) { console.error(err); showAuthError(err.message || String(err)); }
        }
        async function loadUserProfile() {
            const { data, error } = await supabaseClient.from('profiles').select('username, display_name, avatar_url, tier, wallet_address, net_id, local_currency, receipt_show_display_name, receipt_wallet_display, business_verified_at, identity_verified_at').eq('id', currentUser.id).single();
            if (error) { console.error('Failed to load profile:', error); return; }
            currentProfile = data;
            if (!data.wallet_address) { document.getElementById('noWalletState').classList.remove('hidden'); document.getElementById('txContent').classList.add('hidden'); if (window.lucide) lucide.createIcons(); if (window.NetlinkNav) NetlinkNav.init({ activePage: 'activity', profile: data, supabaseClient: supabaseClient, userId: currentUser.id }); return; }
            document.getElementById('txContent').classList.remove('hidden'); if (window.lucide) lucide.createIcons();
            if (window.NetlinkNav) NetlinkNav.init({ activePage: 'activity', profile: data, supabaseClient: supabaseClient, userId: currentUser.id });
            await syncIncomingTransactions(data.wallet_address); await loadTransactions();
        }
        async function syncIncomingTransactions(address) { try { const res = await fetch(`/api/wallet-transactions?address=${encodeURIComponent(address)}&_t=${Date.now()}`); if (!res.ok) return; const data = await res.json(); const incoming = (data.transactions || []).filter((t) => t.type === 'in' && t.hash); if (!incoming.length) return; const { data: existing } = await supabaseClient.from('wallet_transactions').select('hash').eq('owner_id', currentUser.id); const existingHashes = new Set((existing || []).map((r) => r.hash)); const newRows = incoming.filter((t) => !existingHashes.has(t.hash)).map((t) => ({ owner_id: currentUser.id, hash: t.hash, type: 'receive', token: t.token, amount: t.amount, counterparty_address: t.counterparty || null, occurred_at: t.timestamp ? new Date(t.timestamp).toISOString() : new Date().toISOString(), status: 'success', gas_fee: t.gasFee || null })); if (newRows.length) { const { error } = await supabaseClient.from('wallet_transactions').insert(newRows); if (error) console.error('Failed to sync incoming transactions:', error); } }
            catch (err) { console.error('Incoming sync failed:', err); }
        }
        async function loadTransactions() {
            const { data, error } = await supabaseClient.from('wallet_transactions').select('*').eq('owner_id', currentUser.id).order('occurred_at', { ascending: false }).limit(200);
            if (error) { console.error('Failed to load transactions:', error); document.getElementById('skeletonLoader').classList.add('hidden'); document.getElementById('txList').innerHTML = '<div class="p-6 text-center text-sm text-muted">Could not load transaction history.</div>'; document.getElementById('txList').classList.remove('hidden'); return; }
            allTx = data || []; currentPage = 1; document.getElementById('skeletonLoader').classList.add('hidden'); renderTransactions();
        }
        function setFilter(filter) { currentFilter = filter; document.querySelectorAll('.filter-btn').forEach((btn) => btn.classList.toggle('active', btn.dataset.filter === filter)); currentPage = 1; renderTransactions(); }
        function goToPage(page) { currentPage = page; renderTransactions(); document.getElementById('txContent').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        window.goToPage = goToPage;
        function formatTimeAgo(isoOrDate) { const ts = typeof isoOrDate === 'string' ? new Date(isoOrDate).getTime() : isoOrDate; const diffMs = Date.now() - ts; const mins = Math.floor(diffMs / 60000); if (mins < 1) return 'Just now'; if (mins < 60) return `${mins}m ago`; const hours = Math.floor(mins / 60); if (hours < 24) return `${hours}h ago`; const days = Math.floor(hours / 24); if (days < 7) return `${days}d ago`; return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
        function formatDateHeader(isoOrDate) { const d = new Date(isoOrDate), now = new Date(); if (d.toDateString() === now.toDateString()) return 'Today'; const yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1); if (d.toDateString() === yesterday.toDateString()) return 'Yesterday'; return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined }); }
        function formatPolygonScanDate(isoOrDate) { const d = new Date(isoOrDate); const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const month = months[d.getUTCMonth()]; const day = String(d.getUTCDate()).padStart(2, '0'); const year = d.getUTCFullYear(); let hours = d.getUTCHours(); const ampm = hours >= 12 ? 'PM' : 'AM'; hours = hours % 12 || 12; return `${month}-${day}-${year} ${String(hours).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}:${String(d.getUTCSeconds()).padStart(2, '0')} ${ampm} +UTC`; }
        function renderTransactions() { const list = document.getElementById('txList'), pagination = document.getElementById('paginationBar'), emptyState = document.getElementById('emptyState'); const filtered = currentFilter === 'all' ? allTx : allTx.filter((t) => t.type === currentFilter); list.classList.remove('hidden'); if (filtered.length === 0) { list.classList.add('hidden'); emptyState.classList.remove('hidden'); pagination.classList.add('hidden'); if (window.lucide) lucide.createIcons(); return; } emptyState.classList.add('hidden'); const totalPages = Math.max(1, Math.ceil(filtered.length / 10)); if (currentPage > totalPages) currentPage = totalPages; const start = (currentPage - 1) * 10; const slice = filtered.slice(start, start + 10); let currentHeader = null, html = ''; slice.forEach((tx) => { const header = formatDateHeader(tx.occurred_at); if (header !== currentHeader) { currentHeader = header; html += `<div class="date-header"><span>${header}</span></div>`; } html += rowHtml(tx); }); list.innerHTML = html; renderPaginationBar(totalPages); if (window.lucide) lucide.createIcons(); }
        function renderPaginationBar(totalPages) { const bar = document.getElementById('paginationBar'); if (totalPages <= 1) { bar.classList.add('hidden'); bar.innerHTML = ''; return; } bar.classList.remove('hidden'); let html = `<button onclick="goToPage(${Math.max(1, currentPage - 1)})" class="page-btn" ${currentPage === 1 ? 'disabled' : ''}><i data-lucide="chevron-left" class="w-4 h-4"></i></button>`; for (let p = 1; p <= totalPages; p++) html += `<button onclick="goToPage(${p})" class="page-btn ${p === currentPage ? 'active' : ''}">${p}</button>`; html += `<button onclick="goToPage(${Math.min(totalPages, currentPage + 1)})" class="page-btn" ${currentPage === totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" class="w-4 h-4"></i></button>`; bar.innerHTML = html; }
        function toggleDetail(txId) { document.getElementById(`detail-${txId}`).classList.toggle('open'); }
        function rowHtml(tx) { const timeAgo = formatTimeAgo(tx.occurred_at); const explorerUrl = `https://polygonscan.com/tx/${tx.hash}`; if (tx.type === 'swap') return `<div class="tx-card rounded-2xl p-4 cursor-pointer" onclick="toggleDetail('${tx.id}')"><div class="flex items-center gap-4"><div class="w-11 h-11 icon-swap rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="arrow-left-right" class="w-5 h-5"></i></div><div class="flex-1 min-w-0"><p class="text-[15px] font-semibold text-primary truncate">Swap ${tx.token}</p><p class="text-xs text-muted mt-0.5">${timeAgo}</p></div><div class="text-right flex-shrink-0"><p class="text-[15px] font-bold text-primary">${tx.amount} → ${tx.to_amount}</p></div></div><div id="detail-${tx.id}" class="tx-detail"><div class="pt-3 border-t border-subtle mt-3"><div class="flex items-center justify-between text-xs mb-2"><span class="text-muted">Transaction Hash</span><span class="font-mono text-secondary">${truncateAddress(tx.hash)}</span></div><div class="flex items-center justify-between text-xs mb-2"><span class="text-muted">Date</span><span class="text-secondary">${formatPolygonScanDate(tx.occurred_at)}</span></div><a href="${explorerUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs font-medium text-blue-500 hover:text-blue-600 transition mt-1"><i data-lucide="external-link" class="w-3 h-3"></i> View on PolygonScan</a></div></div></div>`; const isIn = tx.type === 'receive'; const icon = isIn ? 'arrow-down-left' : 'arrow-up-right'; const iconClass = isIn ? 'icon-receive' : 'icon-send'; const amountClass = isIn ? 'amount-in' : 'amount-out'; const sign = isIn ? '+' : '-'; const actionLabel = isIn ? 'Received' : 'Sent'; const addressLabel = tx.counterparty_address ? truncateAddress(tx.counterparty_address) : 'External'; return `<div class="tx-card rounded-2xl p-4 cursor-pointer" onclick="toggleDetail('${tx.id}')"><div class="flex items-center gap-4"><div class="w-11 h-11 ${iconClass} rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="${icon}" class="w-5 h-5"></i></div><div class="flex-1 min-w-0"><p class="text-[15px] font-semibold text-primary truncate">${actionLabel} ${tx.token}</p><p class="text-xs text-muted mt-0.5">${addressLabel} · ${timeAgo}</p></div><div class="text-right flex-shrink-0"><p class="text-[17px] font-bold ${amountClass}">${sign}${tx.amount} ${tx.token}</p></div></div><div id="detail-${tx.id}" class="tx-detail"><div class="pt-3 border-t border-subtle mt-3 space-y-2"><div class="flex items-center justify-between text-xs"><span class="text-muted">Transaction Hash</span><span class="font-mono text-secondary">${truncateAddress(tx.hash)}</span></div><div class="flex items-center justify-between text-xs"><span class="text-muted">Date</span><span class="text-secondary">${formatPolygonScanDate(tx.occurred_at)}</span></div><div class="flex items-center gap-3 pt-1"><a href="${explorerUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs font-medium text-blue-500 hover:text-blue-600 transition"><i data-lucide="external-link" class="w-3 h-3"></i> View</a><button onclick="event.stopPropagation(); openReceiptModal('${tx.id}')" class="inline-flex items-center gap-1.5 text-xs font-medium text-secondary hover:text-primary transition"><i data-lucide="receipt" class="w-3 h-3"></i> View Receipt</button></div></div></div></div>`; }
        async function fetchPolPriceUsd() {
            try { const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=polygon-ecosystem-token&vs_currencies=usd'); return (await res.json())['polygon-ecosystem-token']?.usd || null; }
            catch (err) { console.error('Failed to fetch POL price:', err); return null; }
        }

        // Prevents any external call in the receipt flow from hanging
        // forever on a slow/stuck connection.
        async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        // Formats an address per its OWNER's own preference -- 'full',
        // 'short' (truncated), or 'hidden'. Applies equally whether the
        // address belongs to the viewer or the counterparty: the setting
        // always governs how that person's own info appears, everywhere.
        function formatAddressByMode(address, mode) {
            if (!address) return '—';
            if (mode === 'hidden') return 'Hidden by owner';
            if (mode === 'full') return address;
            return truncateAddress(address);
        }

        // Falls back sensibly when the name is hidden: still respects the
        // wallet mode instead of leaking a truncated address when the
        // person specifically chose 'hidden'.
        function receiptIdentityLabel(name, address, mode) {
            if (name) return name;
            if (mode === 'hidden') return 'Private User';
            return truncateAddress(address);
        }

        async function resolveReceiptParty(address) {
            if (!address) return { display_name: null, wallet_mode: 'short' };
            try {
                const { data, error } = await supabaseClient.rpc('resolve_receipt_party', { check_address: address });
                if (error) { console.error(error); return { display_name: null, wallet_mode: 'short' }; }
                const row = Array.isArray(data) ? data[0] : data;
                return row || { display_name: null, wallet_mode: 'short' };
            } catch (err) {
                console.error('Failed to resolve receipt party:', err);
                return { display_name: null, wallet_mode: 'short' };
            }
        }

        async function openReceiptModal(txId) {
            const tx = allTx.find((t) => t.id === txId);
            if (!tx) { showToast('Transaction not found'); return; }
            if (tx.type === 'swap') { showToast('Receipts are only available for sends and receives'); return; }
            currentModalTx = tx;
            const backdrop = document.getElementById('receiptBackdrop');
            const content = document.getElementById('receiptContent');
            const isSend = tx.type === 'send';

            // Self: governed by MY OWN Privacy Settings (identity.html) --
            // applies consistently whether I'm viewing my own receipt or
            // someone else is (though only I can open this modal here).
            const selfShowName = currentProfile.receipt_show_display_name !== false;
            const selfWalletMode = currentProfile.receipt_wallet_display || 'short';
            const selfRawName = currentProfile.display_name || currentProfile.username || 'You';
            const selfName = receiptIdentityLabel(selfShowName ? selfRawName : null, currentProfile.wallet_address, selfWalletMode);
            const selfAddress = formatAddressByMode(currentProfile.wallet_address, selfWalletMode);

            // Counterparty: governed by THEIR OWN Privacy Settings, resolved
            // fresh via RPC -- never assume, never reuse my own preference.
            const counterpartyAddress = tx.counterparty_address || '';
            const party = await resolveReceiptParty(counterpartyAddress);
            const counterpartyName = receiptIdentityLabel(party.display_name, counterpartyAddress, party.wallet_mode);
            const counterpartyAddr = formatAddressByMode(counterpartyAddress, party.wallet_mode);

            const senderLabel = isSend ? selfName : counterpartyName;
            const senderAddr = isSend ? selfAddress : counterpartyAddr;
            const recipientLabel = isSend ? counterpartyName : selfName;
            const recipientAddr = isSend ? counterpartyAddr : selfAddress;
            const tokenLogo = getTokenLogo(tx.token);
            const noteText = tx.note || '';
            const dateStr = formatPolygonScanDate(tx.occurred_at);
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent('https://polygonscan.com/tx/' + tx.hash)}`;

            content.innerHTML = `
                <div class="receipt-sheet" id="receiptSheet">
                    <div class="receipt-header">
                        <div>
                            <div class="receipt-title">Receipt</div>
                            <div class="receipt-subtitle">Digital Asset Transfer</div>
                        </div>
                        <img src="${BRAND_LOGO_URL}" alt="Netlink Pay" class="receipt-brand-logo" crossorigin="anonymous" onerror="this.style.display='none'">
                    </div>
                    <div class="info-box">
                        <div class="info-row">
                            <span class="info-label">Status</span>
                            <span class="info-value">: <span id="modalStatusText">Checking...</span></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Date &amp; Time</span>
                            <span class="info-value">: ${dateStr}</span>
                        </div>
                    </div>
                    <div class="party-grid">
                        <div class="party-col">
                            <div class="party-label">Sender :</div>
                            <div class="party-name">${senderLabel}</div>
                            <div class="party-addr-label">Wallet Address:</div>
                            <div class="party-addr">${senderAddr || '—'}</div>
                        </div>
                        <div class="party-col">
                            <div class="party-label">Recipient :</div>
                            <div class="party-name">${recipientLabel}</div>
                            <div class="party-addr-label">Wallet Address:</div>
                            <div class="party-addr">${recipientAddr || '—'}</div>
                        </div>
                    </div>
                    <div class="receipt-row">
                        <span class="label">Asset</span>
                        <div class="token-row"><img src="${tokenLogo}" class="token-icon" alt="${tx.token}" crossorigin="anonymous" onerror="this.style.display='none'"><span class="value">${tx.token}</span></div>
                    </div>
                    <div class="receipt-row">
                        <span class="label">Amount</span>
                        <span class="value">${formatFintech(tx.amount, 2)}</span>
                    </div>
                    ${noteText ? `<div class="receipt-row"><span class="label">Note</span><span class="value">${noteText}</span></div>` : ''}
                    <div class="receipt-row">
                        <span class="label">Network</span>
                        <span class="value">Polygon (PoS)</span>
                    </div>
                    <div class="receipt-row">
                        <span class="label">Gas Fee</span>
                        <span class="value-mono" id="modalGasFee">—</span>
                    </div>
                    <div class="hash-block" style="margin-top: 16px;">
                        <div style="flex: 0 0 62%; max-width: 62%;">
                            <div class="explorer-caption" style="text-align: left; margin-bottom: 8px;">Transaction Hash</div>
                            <div class="hash-text">${tx.hash}</div>
                        </div>
                        <div class="qr-wrap" style="flex: 0 0 34%; max-width: 34%;">
                            <img src="${qrUrl}" alt="QR Code" crossorigin="anonymous" onerror="this.style.display='none'">
                        </div>
                    </div>
                    <div class="footer-text" style="max-width: 55%;">This document summarizes an on-chain transaction recorded on the Polygon Network.</div>
                </div>`;
            backdrop.classList.add('open');
            document.body.style.overflow = 'hidden';
            if (window.lucide) lucide.createIcons();

            // status/gas_fee are recorded once at insert time (send/swap
            // from the Sequence receipt, receive from PolygonScan's own
            // gasUsed/gasPrice) — no live fetch needed, ever.
            currentTxStatus = tx.status === 'success' ? 'Success' : (tx.status === 'failed' ? 'Failed' : 'Pending');
            const statusEl = document.getElementById('modalStatusText');
            if (statusEl) {
                const cls = tx.status === 'success' ? 'status-success-text' : tx.status === 'failed' ? 'status-failed-text' : 'status-pending-text';
                const icon = tx.status === 'success' ? '&#10003;' : tx.status === 'failed' ? '&#10007;' : '&#8987;';
                statusEl.innerHTML = `<span class="${cls}">${currentTxStatus} ${icon}</span>`;
            }

            const gasEl = document.getElementById('modalGasFee');
            if (tx.gas_fee) {
                gasEl.textContent = formatFintech(tx.gas_fee, 4) + ' POL';
            } else {
                gasEl.textContent = 'Loading...';
                const fee = await fetchAndPersistGasFee(tx);
                gasEl.textContent = fee ? formatFintech(fee, 4) + ' POL' : '—';
            }
        }

        // Only runs when gas_fee wasn't already recorded at insert time
        // (older rows, or the Sequence receipt didn't include it and the
        // one-shot background attempt in pay.html also missed). Runs here
        // instead, at the moment the person is actually looking at the
        // receipt — guaranteed the tab is open — and persists the result
        // so it's instant on every future view.
        async function fetchAndPersistGasFee(tx) {
            try {
                const res = await fetchWithTimeout(`/api/tx-gas-fee?hash=${encodeURIComponent(tx.hash)}`);
                const data = await res.json();
                if (!res.ok || !data.gasFee) return null;

                tx.gas_fee = data.gasFee;
                const { error } = await supabaseClient
                    .from('wallet_transactions').update({ gas_fee: data.gasFee })
                    .eq('owner_id', currentUser.id).eq('hash', tx.hash);
                if (error) console.error('Failed to persist gas fee:', error);

                return data.gasFee;
            } catch (err) {
                console.error('Failed to fetch gas fee:', err);
                return null;
            }
        }

        function closeReceiptModal(e) {
            if (e && e.target !== document.getElementById('receiptBackdrop') && e.target.closest('.receipt-close-btn') === null) return;
            document.getElementById('receiptBackdrop').classList.remove('open');
            document.body.style.overflow = '';
            currentModalTx = null;
        }

        async function downloadReceiptImage() {
            const sheet = document.getElementById('receiptSheet');
            if (!sheet) return;
            const btn = document.getElementById('btnImg');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
            if (window.lucide) lucide.createIcons();
            try {
                await document.fonts.ready;
                const canvas = await html2canvas(sheet, { scale: 3, backgroundColor: '#ffffff', useCORS: true, allowTaint: true, logging: false });
                const link = document.createElement('a');
                link.download = `netlinkpay-receipt-${(currentModalTx.hash || currentModalTx.id).slice(0, 10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('Receipt image saved');
                closeReceiptModal();
            } catch (err) { console.error('Image export failed:', err); showToast('Could not save image — please try again'); }
            finally { btn.disabled = false; btn.innerHTML = original; if (window.lucide) lucide.createIcons(); }
        }

        async function imageUrlToDataUrl(url) {
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                return await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob); });
            } catch (err) { console.error('Failed to load image:', err); return null; }
        }

        async function downloadReceiptPDF() {
            if (!currentModalTx) return;
            const btn = document.getElementById('btnPdf');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
            if (window.lucide) lucide.createIcons();
            try {
                const tx = currentModalTx;
                const sheet = document.getElementById('receiptSheet');
                if (!sheet) throw new Error('Receipt content not found');

                // Make sure gas fee is filled in on-screen first (same data
                // the Image download already relies on), so the PDF — a
                // direct snapshot of this same DOM — matches it exactly.
                if (!tx.gas_fee) await fetchAndPersistGasFee(tx);

                await document.fonts.ready;
                const canvas = await html2canvas(sheet, { scale: 3, backgroundColor: '#ffffff', useCORS: true, allowTaint: true, logging: false });

                const { jsPDF } = window.jspdf;
                // Points-per-pixel at 96dpi reference, matching canvas px size
                // 1:1 so the PDF page is exactly the size of the rendered
                // receipt — no manual layout, no drift from the on-screen version.
                const pxToPt = 0.75;
                const pdfWidth = canvas.width * pxToPt / 3;   // divide by html2canvas scale factor
                const pdfHeight = canvas.height * pxToPt / 3;

                const doc = new jsPDF({ unit: 'pt', format: [pdfWidth, pdfHeight] });
                doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdfWidth, pdfHeight);

                const filenameHash = tx.hash ? tx.hash.slice(0, 10) : tx.id.slice(0, 10);
                doc.save(`netlinkpay-receipt-${filenameHash}.pdf`);
                showToast('Receipt PDF saved');
                closeReceiptModal();
            } catch (err) {
                console.error('Failed to generate receipt PDF:', err);
                showToast('Could not generate receipt — please try again');
            } finally {
                btn.disabled = false;
                btn.innerHTML = original;
                if (window.lucide) lucide.createIcons();
            }
        }

        async function shareReceipt() {
            if (!currentModalTx) return;
            const btn = document.getElementById('btnShare');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
            if (window.lucide) lucide.createIcons();

            try {
                const tx = currentModalTx;
                const sheet = document.getElementById('receiptSheet');
                if (!sheet) throw new Error('Receipt content not found');
                if (!tx.gas_fee) await fetchAndPersistGasFee(tx);

                await document.fonts.ready;
                const canvas = await html2canvas(sheet, { scale: 3, backgroundColor: '#ffffff', useCORS: true, allowTaint: true, logging: false });

                const { jsPDF } = window.jspdf;
                const pxToPt = 0.75;
                const pdfWidth = canvas.width * pxToPt / 3;
                const pdfHeight = canvas.height * pxToPt / 3;
                const doc = new jsPDF({ unit: 'pt', format: [pdfWidth, pdfHeight] });
                doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdfWidth, pdfHeight);

                const filenameHash = tx.hash ? tx.hash.slice(0, 10) : tx.id.slice(0, 10);
                const filename = `netlinkpay-receipt-${filenameHash}.pdf`;
                const pdfBlob = doc.output('blob');
                const pdfFile = new File([pdfBlob], filename, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
                    await navigator.share({ title: 'Netlink Pay Receipt', files: [pdfFile] });
                    closeReceiptModal();
                } else {
                    // Device/browser can't share a file directly — fall back
                    // to just downloading the PDF so the person can still
                    // share it manually from their file system.
                    doc.save(filename);
                    showToast('Sharing files isn\'t supported here — PDF downloaded instead');
                    closeReceiptModal();
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('Failed to share receipt:', err);
                    showToast('Could not share receipt — please try again');
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = original;
                if (window.lucide) lucide.createIcons();
            }
        }

        lucide.createIcons();
        checkAuth();
    </script>

    <script src="/shared/account-menu.js"></script>
    <script src="/shared/nav.js"></script>
</body>
