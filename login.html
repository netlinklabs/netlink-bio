<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Netlink.bio</title>
    <link rel="icon" type="image/png" href="/assets/netlinkbio-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; }
        .tosca { color: #14b8a6; }
        .bg-tosca { background-color: #14b8a6; }
        .hover-bg-tosca-dark:hover { background-color: #0d9488; }
        .toast {
            position: fixed; bottom: 20px; right: 20px; left: 20px;
            max-width: 360px; margin-left: auto;
            background: #ef4444; color: white; padding: 12px 20px;
            border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transform: translateY(100px); transition: transform 0.3s; z-index: 60;
        }
        .toast.show { transform: translateY(0); }
        .toast.success { background: #10b981; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="toast" class="toast"></div>

    <div class="w-full max-w-sm">
        <a href="index" class="flex items-center justify-center mb-8">
            <img src="/assets/netlinkbio-lightBG.png" alt="Netlink.bio" class="h-9">
        </a>

        <div id="claimBanner" class="hidden mb-4 p-3 bg-tosca/10 border border-tosca/30 rounded-xl text-center">
            <p class="text-sm text-gray-700">
                Claiming <span id="claimUsernameLabel" class="font-semibold tosca"></span> — sign up to lock it in
            </p>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
            <div id="authView">
                <div class="flex mb-6 border-b border-gray-100">
                    <button id="tabSignIn" onclick="switchTab('signin')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-tosca tosca">Log in</button>
                    <button id="tabSignUp" onclick="switchTab('signup')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-gray-400">Sign up</button>
                </div>

                <button type="button" onclick="handleGoogleLogin()" class="w-full py-2.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold rounded-xl transition flex items-center justify-center gap-3 mb-4 shadow-sm text-sm">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                    Continue with Google
                </button>

                <p class="text-center text-[11px] text-gray-400 -mt-2 mb-4">Connect your Web3 Wallet in the dashboard later</p>
                <div class="flex items-center gap-3 mb-4">
                    <div class="flex-1 h-px bg-gray-100"></div>
                    <span class="text-xs text-gray-400">or</span>
                    <div class="flex-1 h-px bg-gray-100"></div>
                </div>

                <form id="authForm" class="space-y-4">
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1.5">Email</label>
                        <input id="email" type="email" required placeholder="you@example.com"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-tosca/30 focus:border-tosca transition">
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1.5">Password</label>
                        <div class="relative">
                            <input id="password" type="password" required minlength="6" placeholder="••••••••"
                                class="w-full px-4 py-2.5 pr-11 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-tosca/30 focus:border-tosca transition">
                            <button type="button" id="togglePassword" onclick="togglePasswordVisibility()" aria-label="Show password"
                                class="absolute right-0 top-0 h-full w-11 flex items-center justify-center text-gray-400 hover:text-gray-600 transition">
                                <i id="togglePasswordIcon" data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <p id="forgotPasswordRow" class="text-right mt-1.5">
                            <button type="button" onclick="openForgotPassword()" class="text-xs tosca font-medium hover:underline">Forgot password?</button>
                        </p>
                    </div>
                    <button id="submitBtn" type="submit"
                        class="w-full py-3 bg-tosca hover-bg-tosca-dark text-white font-semibold rounded-xl transition flex items-center justify-center gap-2">
                        <span id="submitLabel">Log in</span>
                        <i id="submitSpinner" data-lucide="loader-2" class="w-4 h-4 animate-spin hidden"></i>
                    </button>
                </form>

                <p id="switchHint" class="text-center text-sm text-gray-500 mt-5">
                    Don't have an account?
                    <button onclick="switchTab('signup')" class="tosca font-medium hover:underline">Sign up</button>
                </p>
            </div>

            <div id="otpView" class="hidden">
                <div class="text-center mb-6">
                    <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-tosca/10 flex items-center justify-center">
                        <i data-lucide="mail-check" class="w-6 h-6 tosca"></i>
                    </div>
                    <h2 class="font-poppins text-lg font-bold text-gray-800">Verify your email</h2>
                    <p class="text-sm text-gray-500 mt-1">Enter the 6-digit code sent to<br><span id="otpEmailLabel" class="font-semibold text-gray-700"></span></p>
                </div>

                <form id="otpForm" class="space-y-4">
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1.5">Verification code</label>
                        <input id="otpCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" required placeholder="123456"
                            oninput="this.value = this.value.replace(/\D/g, '')"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-center tracking-[0.5em] font-semibold focus:outline-none focus:ring-2 focus:ring-tosca/30 focus:border-tosca transition">
                    </div>
                    <p id="otpError" class="hidden text-sm text-red-500 text-center"></p>
                    <button id="otpSubmitBtn" type="submit"
                        class="w-full py-3 bg-tosca hover-bg-tosca-dark text-white font-semibold rounded-xl transition flex items-center justify-center gap-2">
                        <span id="otpSubmitLabel">Verify</span>
                        <i id="otpSubmitSpinner" data-lucide="loader-2" class="w-4 h-4 animate-spin hidden"></i>
                    </button>
                </form>

                <p class="text-center text-sm text-gray-500 mt-5">
                    Didn't get the code?
                    <button id="resendBtn" type="button" onclick="handleResendOtp()" class="tosca font-medium hover:underline">Resend code</button>
                </p>
                <p class="text-center text-sm text-gray-500 mt-2">
                    <button type="button" onclick="backToLogin()" class="text-gray-400 font-medium hover:underline">Use a different email</button>
                </p>
            </div>

            <div id="forgotView" class="hidden">
                <div class="text-center mb-6">
                    <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-tosca/10 flex items-center justify-center">
                        <i data-lucide="key-round" class="w-6 h-6 tosca"></i>
                    </div>
                    <h2 class="font-poppins text-lg font-bold text-gray-800">Reset your password</h2>
                    <p class="text-sm text-gray-500 mt-1">Enter your email and we'll send you a reset link.</p>
                </div>

                <form id="forgotForm" class="space-y-4">
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1.5">Email</label>
                        <input id="forgotEmail" type="email" required placeholder="you@example.com"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-tosca/30 focus:border-tosca transition">
                    </div>
                    <button id="forgotSubmitBtn" type="submit"
                        class="w-full py-3 bg-tosca hover-bg-tosca-dark text-white font-semibold rounded-xl transition flex items-center justify-center gap-2">
                        <span id="forgotSubmitLabel">Send reset link</span>
                        <i id="forgotSubmitSpinner" data-lucide="loader-2" class="w-4 h-4 animate-spin hidden"></i>
                    </button>
                </form>

                <p class="text-center text-sm text-gray-500 mt-5">
                    <button type="button" onclick="closeForgotPassword()" class="text-gray-400 font-medium hover:underline">Back to login</button>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://fuewalufgiclrcgszlit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_FcmN6iwrOJp-5KBtBU8Cww_ZtvzahQb';
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let mode = 'signin';

        function switchTab(newMode) {
            mode = newMode;
            const isSignIn = mode === 'signin';
            document.getElementById('tabSignIn').classList.toggle('border-tosca', isSignIn);
            document.getElementById('tabSignIn').classList.toggle('tosca', isSignIn);
            document.getElementById('tabSignIn').classList.toggle('border-transparent', !isSignIn);
            document.getElementById('tabSignIn').classList.toggle('text-gray-400', !isSignIn);

            document.getElementById('tabSignUp').classList.toggle('border-tosca', !isSignIn);
            document.getElementById('tabSignUp').classList.toggle('tosca', !isSignIn);
            document.getElementById('tabSignUp').classList.toggle('border-transparent', isSignIn);
            document.getElementById('tabSignUp').classList.toggle('text-gray-400', isSignIn);

            document.getElementById('forgotPasswordRow').classList.toggle('hidden', !isSignIn);
            document.getElementById('submitLabel').textContent = isSignIn ? 'Log in' : 'Create account';
            document.getElementById('switchHint').innerHTML = isSignIn
                ? `Don't have an account? <button type="button" onclick="switchTab('signup')" class="tosca font-medium hover:underline">Sign up</button>`
                : `Already have an account? <button type="button" onclick="switchTab('signin')" class="tosca font-medium hover:underline">Log in</button>`;
        }

        window.showToast = function (message, isSuccess = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.toggle('success', isSuccess);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        };

        function setLoading(isLoading) {
            document.getElementById('submitBtn').disabled = isLoading;
            document.getElementById('submitSpinner').classList.toggle('hidden', !isLoading);
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            const btn = document.getElementById('togglePassword');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
            btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            lucide.createIcons();
        }
        window.togglePasswordVisibility = togglePasswordVisibility;

        // ==========================================
        // Email OTP verification step
        // ==========================================
        let pendingOtpEmail = '';
        let resendCooldownInterval = null;
        const RESEND_COOLDOWN_SECONDS = 60;

        function showOtpStep(email) {
            pendingOtpEmail = email;
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('otpView').classList.remove('hidden');
            document.getElementById('otpEmailLabel').textContent = email;
            document.getElementById('otpCode').value = '';
            hideOtpError();
            startResendCooldown();
        }

        function backToLogin() {
            clearInterval(resendCooldownInterval);
            pendingOtpEmail = '';
            document.getElementById('otpView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
            hideOtpError();
        }
        window.backToLogin = backToLogin;

        function showOtpError(message) {
            const el = document.getElementById('otpError');
            el.textContent = message;
            el.classList.remove('hidden');
        }

        function hideOtpError() {
            const el = document.getElementById('otpError');
            el.textContent = '';
            el.classList.add('hidden');
        }

        function setOtpLoading(isLoading) {
            document.getElementById('otpSubmitBtn').disabled = isLoading;
            document.getElementById('otpSubmitSpinner').classList.toggle('hidden', !isLoading);
        }

        function startResendCooldown() {
            clearInterval(resendCooldownInterval);
            let remaining = RESEND_COOLDOWN_SECONDS;
            const btn = document.getElementById('resendBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.textContent = `Resend code (${remaining}s)`;
            resendCooldownInterval = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(resendCooldownInterval);
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.textContent = 'Resend code';
                } else {
                    btn.textContent = `Resend code (${remaining}s)`;
                }
            }, 1000);
        }

        window.handleResendOtp = async function () {
            if (!pendingOtpEmail) return;
            hideOtpError();
            try {
                const { error } = await window.supabaseClient.auth.resend({ type: 'signup', email: pendingOtpEmail });
                if (error) throw error;
                window.showToast('A new code has been sent to your email.', true);
                startResendCooldown();
            } catch (err) {
                showOtpError(err.message || 'Could not resend the code. Please try again.');
            }
        };

        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('otpCode').value.trim();
            hideOtpError();
            if (!code) return;

            setOtpLoading(true);
            try {
                const { error } = await window.supabaseClient.auth.verifyOtp({
                    email: pendingOtpEmail,
                    token: code,
                    type: 'signup'
                });
                if (error) throw error;
                window.location.href = 'dashboard';
            } catch (err) {
                const msg = (err.message || '').toLowerCase();
                if (msg.includes('expire')) {
                    showOtpError('Code expired, request a new one.');
                } else {
                    showOtpError('Invalid code, try again.');
                }
            } finally {
                setOtpLoading(false);
            }
        });

        // ==========================================
        // Forgot password panel
        // ==========================================
        const FORGOT_RESEND_COOLDOWN_SECONDS = 30;
        let forgotCooldownInterval = null;

        function openForgotPassword() {
            const typedEmail = document.getElementById('email').value.trim();
            document.getElementById('forgotEmail').value = typedEmail;
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('forgotView').classList.remove('hidden');
        }
        window.openForgotPassword = openForgotPassword;

        function closeForgotPassword() {
            document.getElementById('forgotView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
        }
        window.closeForgotPassword = closeForgotPassword;

        function setForgotLoading(isLoading) {
            document.getElementById('forgotSubmitSpinner').classList.toggle('hidden', !isLoading);
        }

        function startForgotCooldown() {
            clearInterval(forgotCooldownInterval);
            let remaining = FORGOT_RESEND_COOLDOWN_SECONDS;
            const btn = document.getElementById('forgotSubmitBtn');
            const label = document.getElementById('forgotSubmitLabel');
            btn.disabled = true;
            label.textContent = `Send reset link (${remaining}s)`;
            forgotCooldownInterval = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(forgotCooldownInterval);
                    btn.disabled = false;
                    label.textContent = 'Send reset link';
                } else {
                    label.textContent = `Send reset link (${remaining}s)`;
                }
            }, 1000);
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) return;

            document.getElementById('forgotSubmitBtn').disabled = true;
            setForgotLoading(true);
            try {
                const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://netlink-bio.vercel.app/reset-password.html'
                });
                if (error) throw error;
                window.showToast('If an account exists for this email, a reset link has been sent.', true);
                setForgotLoading(false);
                startForgotCooldown();
            } catch (err) {
                window.showToast(err.message || 'Something went wrong. Please try again.');
                setForgotLoading(false);
                document.getElementById('forgotSubmitBtn').disabled = false;
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const claimedUsername = urlParams.get('username');
        if (claimedUsername) {
            sessionStorage.setItem('pendingUsername', claimedUsername);
            document.getElementById('claimUsernameLabel').textContent = `netlink.bio/${claimedUsername}`;
            document.getElementById('claimBanner').classList.remove('hidden');
        }

        // ==========================================
        // 🚀 FUNGSI GOOGLE OAUTH SUPER AMAN
        // ==========================================
        window.handleGoogleLogin = async function () {
            try {
                const { error } = await window.supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { 
                        redirectTo: window.location.origin + '/dashboard.html' 
                    }
                });
                if (error) throw error;
            } catch (err) {
                console.error('OAuth Error:', err);
                window.showToast('Could not connect to Google. Please try again.');
            }
        };

        // Manual email/password form
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            setLoading(true);
            try {
                if (mode === 'signin') {
                    const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
                    const isUnconfirmedError = error && (error.message || '').toLowerCase().includes('not confirmed');

                    if (error && !isUnconfirmedError) throw error;

                    if (isUnconfirmedError || !data.user || !data.user.email_confirmed_at) {
                        const { error: resendError } = await window.supabaseClient.auth.resend({ type: 'signup', email });
                        if (resendError) throw resendError;
                        window.showToast('Please verify your email to continue.', true);
                        showOtpStep(email);
                    } else {
                        window.location.href = 'dashboard';
                    }
                } else {
                    const { error } = await window.supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    window.showToast('We sent a verification code to your email.', true);
                    showOtpStep(email);
                }
            } catch (err) {
                window.showToast(err.message || 'Something went wrong. Please try again.');
            } finally {
                setLoading(false);
            }
        });

        // Redirect if already logged in and verified
        (async () => {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) return;

            if (session.user && !session.user.email_confirmed_at) {
                try {
                    await window.supabaseClient.auth.resend({ type: 'signup', email: session.user.email });
                } catch (err) {
                    console.error('Resend error:', err);
                }
                showOtpStep(session.user.email);
            } else {
                window.location.href = 'dashboard';
            }
        })();
    </script>
</body>
</html>
